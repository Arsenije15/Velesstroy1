<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Заметки — ВЕЛЕССТРОЙ</title><link rel="manifest" href="/zametki/manifest.webmanifest"><link rel="icon" href="/zametki/icon.svg">
<meta name="theme-color" content="#14181f">
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14181f;--mut:#5b6472;--line:#d9dee5;--acc:#f2b705;--g:#15803d;--gbg:#dcfce7;--r:#b91c1c;--ybg:#fef3c7;--y:#a16207}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#181e26;--ink:#e8edf3;--mut:#9aa5b4;--line:#2a3340;--gbg:#123321;--ybg:#3a2c0b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:#14181f;color:#fff;padding:12px 16px calc(12px) ;border-bottom:4px solid var(--acc);position:sticky;top:0;z-index:3}
header .t{display:flex;align-items:center;gap:8px}header b{font-size:19px;flex:1}header small{color:#c9d1db;font-size:12px}
main{max-width:720px;margin:0 auto;padding:12px 16px 120px}
.add{display:flex;gap:8px;margin:0 0 10px}textarea,input{width:100%;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:48px}
textarea{resize:vertical;min-height:52px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 14px;min-height:48px;cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:#14181f;font-weight:800}
.tabs{display:flex;gap:6px;margin:6px 0 10px;flex-wrap:wrap}.tabs button{min-height:40px;padding:6px 12px;font-size:15px}.tabs button.on{background:#14181f;color:#fff;border-color:#14181f}
.it{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 8px}
.it input[type=checkbox]{width:28px;height:28px;min-height:0;flex:none;margin-top:2px;accent-color:var(--g)}
.it .tx{flex:1;min-width:0;white-space:pre-wrap;word-wrap:break-word}.it.done .tx{text-decoration:line-through;color:var(--mut)}
.it .m{font-size:13px;color:var(--mut);margin-top:4px}.it .done-m{color:var(--g);font-weight:600}
.it .x{min-height:36px;padding:4px 10px;border:0;background:transparent;color:var(--mut);font-size:20px}
.ban{background:var(--ybg);color:var(--y);border-radius:10px;padding:10px 12px;font-size:14px;margin:0 0 10px}
.empty{text-align:center;color:var(--mut);padding:30px 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.bar button{min-height:42px;font-size:14px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#14181f;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
</style></head><body>
<header><div class="t"><b>📝 Заметки</b><small id="net"></small></div><small>Хранятся только в этом телефоне · работают без интернета</small></header>
<main>
  <div id="ban"></div>
  <div class="add"><textarea id="tx" placeholder="Новая заметка или задача…" rows="2"></textarea><button class="p" id="ad" aria-label="Добавить">＋</button></div>
  <input id="q" placeholder="🔎 Поиск" autocomplete="off" style="margin-bottom:6px">
  <div class="tabs" id="tabs"></div>
  <div id="ls"></div>
</main>
<div class="bar"><button id="sh">📤 Поделиться списком</button><button id="ex">💾 Сохранить копию</button><label><button id="imb" type="button">📂 Восстановить</button><input type="file" id="im" accept=".json,application/json" hidden></label><button id="cl">🧹 Убрать сделанные</button></div>
<div id="toast" role="status"></div>
<script>
const K="vs_zametki_v1";let F="active",Q="";
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now=()=>new Date().toISOString();
const fmt=s=>{const d=new Date(s);return isNaN(d)?"":d.toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"})};
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,1800)}
let mem=[];
function load(){try{const v=JSON.parse(localStorage.getItem(K)||"[]");return Array.isArray(v)?v:[]}catch(_){return mem}}
function save(l){mem=l;try{localStorage.setItem(K,JSON.stringify(l))}catch(_){toast("Память телефона недоступна — заметки сохранятся только до закрытия")}}
let L=load();
function draw(){
  const act=L.filter(x=>!x.done).length,dn=L.filter(x=>x.done).length;
  document.getElementById("tabs").innerHTML=[["active","Не сделано · "+act],["done","Сделано · "+dn],["all","Все · "+L.length]].map(t=>`<button class="${F===t[0]?"on":""}" data-f="${t[0]}">${t[1]}</button>`).join("");
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{F=b.dataset.f;draw()});
  const q=Q.toLowerCase();
  const v=L.filter(x=>(F==="all"||(F==="done")===!!x.done)&&(!q||x.text.toLowerCase().includes(q)))
    .sort((a,b)=>F==="done"?(b.done_at||"").localeCompare(a.done_at||""):(a.done-b.done)||(b.at||"").localeCompare(a.at||""));
  document.getElementById("ls").innerHTML=v.map(x=>`<div class="it ${x.done?"done":""}"><input type="checkbox" data-c="${x.id}" ${x.done?"checked":""} aria-label="Сделано">
    <div style="flex:1;min-width:0"><div class="tx" data-e="${x.id}">${esc(x.text)}</div><div class="m">${fmt(x.at)}${x.done?` · <span class="done-m">✔ сделано ${fmt(x.done_at)}</span>`:""}</div></div>
    <button class="x" data-d="${x.id}" aria-label="Удалить">✕</button></div>`).join("")||`<div class="empty">${q?"Ничего не найдено":F==="active"?"Всё сделано 👍":"Пусто"}</div>`;
  document.querySelectorAll("[data-c]").forEach(c=>c.onchange=()=>{const x=L.find(y=>y.id===c.dataset.c);x.done=c.checked;x.done_at=c.checked?now():"";save(L);setTimeout(draw,c.checked?250:0)});
  document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{const x=L.find(y=>y.id===b.dataset.d);if(!confirm("Удалить заметку?\n\n"+x.text.slice(0,80)))return;L=L.filter(y=>y!==x);save(L);draw()});
  document.querySelectorAll("[data-e]").forEach(d=>d.onclick=()=>{const x=L.find(y=>y.id===d.dataset.e);const t=prompt("Изменить заметку:",x.text);if(t===null)return;if(!t.trim())return;x.text=t.trim();x.edited=now();save(L);draw()});
}
function add(){const el=document.getElementById("tx");const t=el.value.trim();if(!t)return el.focus();
  L.unshift({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),text:t,at:now(),done:false,done_at:""});save(L);el.value="";if(F==="done")F="active";draw();el.focus()}
document.getElementById("ad").onclick=add;
document.getElementById("tx").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();add()}};
document.getElementById("q").oninput=e=>{Q=e.target.value.trim();draw()};
document.getElementById("cl").onclick=()=>{const n=L.filter(x=>x.done).length;if(!n)return toast("Сделанных нет");if(!confirm("Убрать сделанные ("+n+")?"))return;L=L.filter(x=>!x.done);save(L);draw()};
const listText=()=>L.filter(x=>F==="all"||(F==="done")===!!x.done).map(x=>(x.done?"✔ ":"☐ ")+x.text).join("\n");
document.getElementById("sh").onclick=async()=>{const t=listText();if(!t)return toast("Список пуст");
  if(navigator.share){try{await navigator.share({title:"Заметки",text:t});return}catch(_){return}}
  try{await navigator.clipboard.writeText(t);toast("Скопировано")}catch(_){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();toast("Скопировано")}};
document.getElementById("ex").onclick=()=>{const b=new Blob([JSON.stringify({app:"vs-zametki",saved:now(),items:L},null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="zametki_"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();a.remove();toast("Копия сохранена в «Загрузки»")};
document.getElementById("imb").onclick=()=>document.getElementById("im").click();
document.getElementById("im").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
  try{const j=JSON.parse(await f.text());const items=Array.isArray(j)?j:j.items;if(!Array.isArray(items))throw 0;
    const ids=new Set(L.map(x=>x.id));let n=0;items.forEach(x=>{if(x&&x.id&&x.text&&!ids.has(x.id)){L.push({id:x.id,text:String(x.text),at:x.at||now(),done:!!x.done,done_at:x.done_at||""});n++}});
    save(L);draw();toast("Добавлено из копии: "+n)}catch(_){toast("Это не файл копии заметок")}};
function net(){document.getElementById("net").textContent=navigator.onLine?"":"● без сети"}
addEventListener("online",net);addEventListener("offline",net);net();
// без https телефон не даёт «запомнить» страницу — предупреждаем
if("serviceWorker" in navigator&&window.isSecureContext){navigator.serviceWorker.register("/zametki/sw.js",{scope:"/zametki/"}).catch(()=>{})}
else document.getElementById("ban").innerHTML=`<div class="ban">Заметки сохраняются в телефоне. Открываться <b>без интернета</b> страница начнёт после перехода на защищённый адрес (https).</div>`;
draw();
</script></body></html>
