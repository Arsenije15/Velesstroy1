<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2430">
<title>ВЕЛЕССТРОЙ — Склад</title>
<style>
:root{--ink:#111827;--muted:#5b6472;--line:#d9dee5;--bg:#eef1f4;--card:#fff;--head:#1c2430;--acc:#f2b705;
--g:#15803d;--gbg:#dcfce7;--r:#b91c1c;--rbg:#fee2e2;--y:#a16207;--ybg:#fef3c7;--b:#1d4ed8;--bbg:#dbeafe;--v:#6d28d9;--vbg:#ede9fe;--o:#c2410c;--obg:#ffedd5;--gr:#4b5563;--grbg:#e5e7eb}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}
header{background:var(--head);color:#fff;position:sticky;top:0;z-index:20;padding:0 12px;display:flex;align-items:center;gap:10px;min-height:56px}
header .logo{font-weight:800;letter-spacing:.04em}
header .logo b{color:var(--acc)}
header .sp{flex:1}
header .who{font-size:13px;opacity:.85;text-align:right;line-height:1.2}
.net{width:10px;height:10px;border-radius:50%;background:#22c55e;flex:none}
.net.off{background:#ef4444}.net.wait{background:#f59e0b}
nav.top{display:none;gap:4px}
nav a,.tab{color:inherit;text-decoration:none}
nav.top a{padding:8px 12px;border-radius:6px;font-weight:600;font-size:14px;color:#cbd5e1}
nav.top a.on{background:#2f3b4c;color:#fff;box-shadow:inset 0 -3px 0 var(--acc)}
html{scroll-padding-top:70px;scroll-padding-bottom:84px} /* кнопки не прячутся под шапку и нижнее меню при прокрутке к полю */
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--head);display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom a{flex:1;min-width:0;text-align:center;color:#cbd5e1;font-size:10px;font-weight:600;padding:8px 1px 7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.bottom a i{display:block;font-style:normal;font-size:20px;line-height:24px}
nav.bottom a.on{color:var(--acc)}
main{max-width:1100px;margin:0 auto;padding:14px 12px 96px}
h1{font-size:22px;margin:4px 0 12px}h2{font-size:18px;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;border-left:6px solid var(--gr);cursor:pointer}
.kpi .n{font-size:28px;font-weight:800}.kpi .t{font-size:13px;color:var(--muted);font-weight:600}
.kpi.g{border-left-color:var(--g)}.kpi.r{border-left-color:var(--r)}.kpi.y{border-left-color:var(--acc)}.kpi.b{border-left-color:var(--b)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 18px;border-radius:8px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer;color:var(--ink)}
.btn.p{background:var(--head);color:#fff;border-color:var(--head)}
.btn.acc{background:var(--acc);border-color:#d39e00;color:#111}
.btn.g{background:var(--g);color:#fff;border-color:var(--g)}
.btn.r{background:var(--r);color:#fff;border-color:var(--r)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.btn.big{width:100%;min-height:60px;font-size:18px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1}
label.f{display:block;margin:10px 0 4px;font-weight:600;font-size:14px}
input,select,textarea{width:100%;min-height:48px;padding:10px 12px;border:1px solid #b8c0cc;border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:80px}
input[type=checkbox]{width:28px;height:28px;min-height:0;flex:none;accent-color:var(--g)}
.banner{border-radius:10px;padding:16px;margin-bottom:12px;font-weight:800;font-size:20px;border:2px solid}
.banner small{display:block;font-weight:500;font-size:15px;margin-top:6px;white-space:pre-line}
.banner.green{background:var(--gbg);border-color:var(--g);color:var(--g)}
.banner.red{background:var(--rbg);border-color:var(--r);color:var(--r)}
.banner.yellow,.banner.notfound{background:var(--ybg);border-color:var(--acc);color:var(--y)}
.banner.blue{background:var(--bbg);border-color:var(--b);color:var(--b)}
.banner.gray{background:var(--grbg);border-color:var(--gr);color:var(--gr)}
.banner.violet{background:var(--vbg);border-color:var(--v);color:var(--v)}
.debtrow{background:var(--vbg)!important;box-shadow:inset 5px 0 0 var(--v)}.list .it.debtrow{padding-left:10px;border-radius:6px}.debtcard{border-color:var(--v);border-width:2px}
.tab.debt{border-color:var(--v);color:var(--v)}.tab.debt.on{background:var(--v);border-color:var(--v);color:#fff}
.kpi.v{border-left-color:var(--v)}.kpi.o{border-left-color:var(--o)}
.banner.orange{background:var(--obg);border-color:var(--o);color:var(--o)}.pill.o{background:var(--obg);color:var(--o)}
.ovrbox{border:2px solid var(--o);background:var(--obg)}.ovrbox h2{color:var(--o)}tr.ovr td{background:var(--obg)}.res.st-over{border-left-color:var(--o)}
.btn.o{background:var(--o);color:#fff;border-color:var(--o)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.chip{border:1px solid var(--line);background:#f6f7f9;border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steps{display:flex;flex-direction:column;gap:2px;margin-top:8px}.step{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px dashed var(--line)}.step.done .t{color:var(--g);font-weight:700}
.line{display:flex;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.line.mine{font-weight:700}
input.ocrw,textarea.ocrw{background:#fef9c3;border-color:#ca8a04}input.ocrf{background:#eff6ff}.ocrbox{background:var(--bbg);border:1px solid var(--b);border-radius:10px;padding:12px;margin:10px 0}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
.pill.v{background:var(--vbg);color:var(--v)}.pill.g{background:var(--gbg);color:var(--g)}.pill.r{background:var(--rbg);color:var(--r)}.pill.y{background:var(--ybg);color:var(--y)}
.pill.b{background:var(--bbg);color:var(--b)}.pill.gr{background:var(--grbg);color:var(--gr)}
.list .it{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.muted{color:var(--muted);font-size:14px}
.res{border-left:8px solid var(--g)}
.res.st-reserved{border-left-color:var(--acc)}.res.st-in_work{border-left-color:var(--b)}.res.st-unavailable{border-left-color:var(--r)}
.res .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.res .name{font-weight:800;font-size:17px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tab{padding:10px 14px;border-radius:8px;background:#fff;border:1px solid var(--line);font-weight:700;white-space:nowrap;cursor:pointer;min-height:44px}
.tab.on{background:var(--head);color:#fff;border-color:var(--head)}
.chk{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.chk .t{font-weight:700}.chk.done .t{color:var(--g)}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos a{display:block;width:96px;height:96px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:#f3f4f6;position:relative}
.photos img{width:100%;height:100%;object-fit:cover}
.photos .ph{position:relative}.phx{position:absolute;top:3px;right:3px;z-index:2;width:30px;height:30px;border-radius:50%;border:2px solid #fff;background:var(--r);color:#fff;font-weight:800;font-size:14px;line-height:1;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.gap2 td{background:var(--rbg)}
.photos span{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:2px 4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:#f6f7f9;font-size:12px;text-transform:uppercase;color:var(--muted)}
.tw{overflow-x:auto}
.spdz{border:3px dashed var(--line);border-radius:12px;padding:26px 16px;text-align:center;display:grid;gap:6px;background:var(--bg);transition:.15s}.spdz.on{border-color:var(--acc);background:var(--ybg)}.spdz b{font-size:18px}
.spnm{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.spnm div{display:flex;align-items:center;gap:6px}.spnm input{flex:1;min-width:0}.spdot{width:12px;height:12px;border-radius:3px;flex:none}
.sp-ok,.sp-warn{padding:10px 12px;border-radius:8px;font-weight:700}.sp-ok{background:var(--gbg);color:var(--g)}.sp-warn{background:var(--ybg);color:var(--y)}
.spcols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:12px}@media(max-width:1100px){.spcols{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.spcols{grid-template-columns:1fr}}
.spcol{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:10px;min-width:0}.spcol h3{margin:0;padding:10px 12px 0;overflow-wrap:anywhere}.spcol .sps{padding:2px 12px 8px;font-size:13px;border-bottom:1px solid var(--line)}.spcol .sps b{font-size:20px;color:var(--ink)}
.spcol ol{list-style:none;margin:0;padding:0;max-height:560px;overflow:auto}.spcol li{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:6px 12px;border-bottom:1px dashed var(--line);align-items:center}.spcol li>span:first-child{overflow-wrap:anywhere;min-width:0}.spcol li.top>span:first-child{font-weight:700}.spcol li.hit{background:var(--ybg)}.spm{font-size:12px;white-space:nowrap}.spcol li select{grid-column:1/-1;min-height:30px;padding:2px 6px;font-size:13px}
td.r{text-align:right;font-variant-numeric:tabular-nums}
.g2x{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}@media(max-width:420px){.g2x{grid-template-columns:1fr}}
#toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:90;max-width:92vw;display:flex;flex-direction:column;gap:6px}
#toast div{background:#111827;color:#fff;padding:12px 16px;border-radius:8px;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast div.err{background:var(--r)}#toast div.ok{background:var(--g)}
.modal{position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px 24px}
.modal h3{margin:0 0 6px;font-size:19px}
.netbar{background:var(--r);color:#fff;text-align:center;font-weight:700;padding:6px;font-size:14px;display:none}
.netbar.show{display:block}
.login{max-width:420px;margin:8vh auto;padding:0 12px}
.login .card{padding:22px}
.empty{color:var(--muted);text-align:center;padding:18px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}.kv b{color:var(--muted);font-weight:600}
.print-only{display:none}
@media (min-width:860px){
  nav.top{display:flex}nav.bottom{display:none}main{padding-bottom:30px}
  .grid{grid-template-columns:repeat(3,1fr)}
  .modal{align-items:center}.modal .box{border-radius:14px}
  #toast{bottom:24px}
}
@media print{
  header,nav,.noprint,#toast,.netbar{display:none!important}
  body{background:#fff}main{padding:0}.card{border:0;padding:0}.print-only{display:block}
}
</style>

<body>
<div class="netbar" id="netbar">НЕТ СВЯЗИ С СЕРВЕРОМ — данные на экране могут быть неактуальны</div>
<div id="app"></div>
<div id="toast"></div>
<script>
"use strict";
/* ВЕЛЕССТРОЙ — клиент. Без внешних библиотек и CDN: работает в России без VPN, грузится только с вашего сервера. */
const T = {
  roles:{admin:"Администратор",manager:"Руководитель",storekeeper:"Кладовщик",viewer:"Просмотр"},
  rst:{denied:["ПРИЁМКА ЗАПРЕЩЕНА","r"],pending_approval:["ЖДЁТ СОГЛАСОВАНИЯ","y"],rejected:["ОТКАЗАНО","r"],in_progress:["В РАБОТЕ","b"],
       nonconformity:["НЕСООТВЕТСТВИЕ","r"],completed:["ПРИНЯТО","g"],completed_remarks:["ПРИНЯТО С ЗАМЕЧАНИЯМИ","y"]},
  check:{green:"ЗЕЛЁНЫЙ — ПРИЁМКА РАЗРЕШЕНА",red:"КРАСНЫЙ — ПРИЁМКА ЗАПРЕЩЕНА",yellow:"ЖЁЛТЫЙ — ТРЕБУЕТСЯ СОГЛАСОВАНИЕ",notfound:"УПД НЕ НАЙДЕН В БАЗЕ. ТРЕБУЕТСЯ ПРОВЕРКА."},
  act:{allow:["Разрешено","g"],deny:["Запрещено","r"],approval:["Нужно согласование","y"]},
  cat:{crane:"Краны и техника",worker:"Работники (стропальщики)"},
  kind:{document:"Документ",material:"Материал",damage:"Повреждение"}
};
const S = {auth:null,user:null,route:"",data:{},online:true,rt:"wait",fileToken:null,fileTokenAt:0};
const $ = (s,el)=> (el||document).querySelector(s);
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pd(s){if(!s)return null;const d=new Date(String(s).replace(" ","T"));return isNaN(d)?null:d}
function dt(s){const d=pd(s);return d?d.toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}):"—"}
function tm(s){const d=pd(s);if(!d)return"—";const t=new Date();const same=d.toDateString()===t.toDateString();
  return same?d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}):d.toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}
function dLocalInput(d){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,16)}
  function toast(msg,cls){const box=$("#toast");while(box.children.length>=2)box.firstChild.remove();const el=document.createElement("div");el.textContent=msg;if(cls)el.className=cls;$("#toast").appendChild(el);setTimeout(()=>el.remove(),cls==="err"?6500:3500)}
const can = {
  write:()=>["admin","manager","storekeeper"].includes(role()),
  manage:()=>["admin","manager"].includes(role()),
  admin:()=>role()==="admin"
};
function role(){return S.user?S.user.role:""}
function uname(id){const u=(S.data.users||[]).find(x=>x.id===id);return u?(u.name||u.username):"—"}

/* ---------- API ---------- */
async function api(method,path,body,isForm){
  const h={};if(S.auth)h.Authorization=S.auth;
  if(body&&!isForm)h["Content-Type"]="application/json";
  let r;
  try{r=await fetch(path,{method,headers:h,body:body?(isForm?body:JSON.stringify(body)):undefined})}
  catch(e){setOnline(false);throw new Error("Нет связи с сервером. Проверьте интернет и повторите.")}
  setOnline(true);
  let j=null;try{j=await r.json()}catch(_){}
  if(r.status===401&&S.auth){logout(true);throw new Error("Сессия истекла — войдите снова.")}
  if(!r.ok){let m=(j&&j.message)||("Ошибка "+r.status);
    if(j&&j.data&&typeof j.data==="object"){const k=Object.keys(j.data)[0];if(k&&j.data[k]&&j.data[k].message)m+=" ("+k+": "+j.data[k].message+")"}
    if(r.status===403||(r.status===404&&method!=="GET"))m=m.includes("Недостаточно")||m.includes("может дать")?m:"Недостаточно прав для этого действия.";
    // Запрет «⛔»: руководитель / администратор может обойти с объяснением
    if(r.status===409&&m.startsWith("⛔")&&can.manage()&&method==="POST"&&!isForm&&body&&!body.override){
      const why=await askOverride(m);
      if(why)return api(method,path,Object.assign({},body,{override:why}));
      const e2=new Error("Отменено — запрет остался.");e2.status=409;throw e2}
    const err=new Error(m.replace(/^⛔ /,"").replace(/\n⛔ /g,"\n"));err.status=r.status;err.ban=m.startsWith("⛔");throw err}
  return j;
}
function askOverride(msg){return new Promise(res=>{
  const o=document.createElement("div");o.className="modal";o.style.zIndex=70;o.id="ovrm";
  o.innerHTML=`<div class="box"><h3 style="color:var(--o)">⚠ Действие запрещено</h3>
   <div class="banner orange" style="font-size:15px">${msg.replace(/^⛔ /,"").split("\n⛔ ").map(esc).join("<br>")}</div>
   <div class="muted">Вы можете обойти запрет как ${role()==="admin"?"администратор":"руководитель"}. Объяснение, ваше имя и время запишутся в журнал — начальник увидит это оранжевым.</div>
   <label class="f">Объяснение (обязательно) *</label><input id="ovr_r" data-sug="reason" data-chips autocomplete="off" placeholder="почему можно">
   <div class="row" style="margin-top:14px"><button class="btn o grow" id="ovr_ok">⚠ ОБОЙТИ ЗАПРЕТ</button><button class="btn" id="ovr_no">Отмена</button></div></div>`;
  document.body.appendChild(o);sugAttach(o);
  const done=v=>{o.remove();res(v)};
  o.querySelector("#ovr_no").onclick=()=>done(null);
  o.querySelector("#ovr_ok").onclick=()=>{const v=o.querySelector("#ovr_r").value.trim();if(v.length<4){toast("Напишите объяснение — почему можно","err");return}done(v)};
  setTimeout(()=>{const i=o.querySelector("#ovr_r");if(i)i.focus()},50)})}
/* ---------- Память ручного ввода: подсказки (общие для всех) ---------- */
let SUGV=null,SUGM={};
function sugList(f){if(SUGV!==S.data.suggestions){SUGV=S.data.suggestions;SUGM={};(SUGV||[]).forEach(x=>{(SUGM[x.field]=SUGM[x.field]||[]).push(x.value)})}
  const l=SUGM[f]||[];if(f==="supplier")return [...new Set(l.concat((S.data.rules||[]).map(r=>r.supplier).filter(Boolean)))];return l}
// перед формой: свежие подсказки (если ввод был только что на другом телефоне)
async function sugFresh(fields){try{
  const j=await api("GET","/api/collections/suggestions/records?"+new URLSearchParams({perPage:1000,sort:"-last",filter:fields.map(f=>`field="${f}"`).join("||")}));
  S.data.suggestions=j.items.concat((S.data.suggestions||[]).filter(x=>!fields.includes(x.field)))}catch(_){}}
function sugAttach(root){(root||document).querySelectorAll("[data-sug]").forEach(inp=>{const f=inp.dataset.sug,id="dl_"+f;
  const vals=[...new Set(sugList(f))];
  let dl=document.getElementById(id);if(!dl){dl=document.createElement("datalist");dl.id=id;document.body.appendChild(dl)}
  if(dl.dataset.v!==String(vals.length)+(vals[0]||"")){dl.innerHTML=vals.slice(0,400).map(v=>`<option value="${esc(v)}">`).join("");dl.dataset.v=String(vals.length)+(vals[0]||"")}
  inp.setAttribute("list",id);inp.setAttribute("autocomplete","off");
  if(inp.hasAttribute("data-prefill")&&!inp.value&&vals[0]&&!inp.dataset.pf){inp.value=vals[0];inp.dataset.pf="1"}
  if(inp.hasAttribute("data-chips")&&!(inp.nextElementSibling&&inp.nextElementSibling.classList.contains("chips"))){const top=vals.slice(0,4);if(!top.length)return;
    const c=document.createElement("div");c.className="chips noprint";c.innerHTML=top.map(v=>`<button type="button" class="chip" title="${esc(v)}">${esc(v.length>38?v.slice(0,38)+"…":v)}</button>`).join("");
    c.querySelectorAll("button").forEach((b,i)=>b.onclick=()=>{inp.value=top[i];inp.dispatchEvent(new Event("input",{bubbles:true}));inp.dispatchEvent(new Event("change",{bubbles:true}))});inp.after(c)}})}
async function all(col,filter,sort,expand){
  let page=1,out=[];
  for(;;){const q=new URLSearchParams({page,perPage:500});if(filter)q.set("filter",filter);if(sort)q.set("sort",sort);if(expand)q.set("expand",expand);
    const j=await api("GET","/api/collections/"+col+"/records?"+q);out=out.concat(j.items);if(page>=j.totalPages)break;page++}
  return out;
}
async function act(btn,fn,okMsg){

function resInfo(r,now){
  now=now||new Date();
  const rs=(S.data.reservations||[]).filter(x=>x.resource===r.id&&(x.status==="reserved"||x.status==="in_work"));
  const cur=rs.filter(x=>x.status==="in_work"||(pd(x.start)<=now&&pd(x.end)>now));
  const next=rs.filter(x=>x.status==="reserved"&&pd(x.start)>now).sort((a,b)=>pd(a.start)-pd(b.start));
  const overdue=rs.filter(x=>pd(x.end)<now);
  let st="free";
  if(r.unavailable)st="unavailable";else if(cur.some(x=>x.status==="in_work"))st="in_work";else if(cur.length)st="reserved";
  return {st,cur,next,overdue,all:rs};
}

async function shrink(file){
  if(!/^image\/(jpeg|png|webp)/.test(file.type)||file.size<400000)return file;
  try{const bmp=await createImageBitmap(file);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(res=>c.toBlob(res,"image/jpeg",.8));return b?new File([b],file.name.replace(/\.\w+$/,"")+".jpg",{type:"image/jpeg"}):file}catch(_){return file}
}
async function uploadFiles(rid,files,kind){
  for(const f of files){toast("Загрузка: "+f.name+"…");
    await act(null,async()=>{const fd=new FormData();fd.append("receipt",rid);fd.append("kind",kind);fd.append("uploaded_by",S.user.id);fd.append("file",await shrink(f));
      await api("POST","/api/collections/attachments/records",fd,true)},"Файл загружен")}
  render(["attachments"]);
}

  const rank=c=>(isKnown(c)?100:0)+(cnt[c]||0)*2+(/^[А-ЯA-Z]/.test(c)?1:0)+(latinish(c)?-50:0)+skey(c).length*0.01;
  return vals.map(v=>{if(!v)return {v,fixed:false};

// Картинка задачи: текст + фото на одном JPEG
async function stropCard(text,photo){
  const W=1080,P=48,c=document.createElement("canvas"),x=c.getContext("2d");x.font="36px sans-serif";
  const wrap=(s,font,max)=>{x.font=font;const out=[];s.split("\n").forEach(par=>{let ln="";par.split(" ").forEach(w=>{const t=ln?ln+" "+w:w;if(x.measureText(t).width>max&&ln){out.push(ln);ln=w}else ln=t});out.push(ln)});return out};
  const lines=text.split("\n");const head=lines.shift();const body=wrap(lines.join("\n"),"36px sans-serif",W-2*P);
  let img=null,ih=0;if(photo){img=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=URL.createObjectURL(photo)});if(img)ih=Math.min(1100,Math.round(img.height*(W-2*P)/img.width))}
  c.width=W;c.height=130+body.length*48+P+(img?ih+P:0)+40;
  x.fillStyle="#fff";x.fillRect(0,0,W,c.height);x.fillStyle="#14181f";x.fillRect(0,0,W,110);x.fillStyle="#f2b705";x.fillRect(0,110,W,8);
  x.fillStyle="#fff";x.font="bold 42px sans-serif";x.fillText(head,P,70);
  let y=170;body.forEach(l=>{const m=l.match(/^([^:]{2,20}):\s(.*)$/);x.fillStyle="#14181f";
    if(m){x.font="bold 36px sans-serif";x.fillText(m[1]+":",P,y);const w=x.measureText(m[1]+": ").width;x.font="36px sans-serif";x.fillText(m[2],P+w,y)}else{x.font="36px sans-serif";x.fillText(l,P,y)}y+=48});
  if(img){y+=10;x.drawImage(img,P,y,W-2*P,ih);y+=ih}
  x.fillStyle="#5b6472";x.font="24px sans-serif";x.fillText("ВЕЛЕССТРОЙ",P,c.height-20);
  return await new Promise(r=>c.toBlob(r,"image/jpeg",.85));
}

function spCompute(){
  const L=SP.F.filter(f=>f.on).sort((a,b)=>spMetric(b)-spMetric(a)||a.name.localeCompare(b.name,"ru"));
  const T=L.length,base=Math.floor(T/5),rem=T%5,quota=[0,1,2,3,4].map(i=>base+(i<rem?1:0));
  const topN=Math.min(Math.max(0,SP.topn|0),T),asg=new Map(),cnt=[0,0,0,0,0],load=[0,0,0,0,0];
  const put=(f,p)=>{asg.set(f,p);cnt[p]++;load[p]+=spMetric(f)};

function parseMpz(rows){

    out.push({line_no:i+1,warehouse:wh,account:xlStr(v(r,C.acc)),name,code:String(v(r,C.code)??"").trim(),quality:xlStr(v(r,C.q)),unit:xlStr(v(r,C.unit)),
      qty_start:nv(v(r,C.st[0])),sum_start:nv(v(r,C.st[1])),qty_in:nv(v(r,C.in[0])),sum_in:nv(v(r,C.in[1])),qty_out:nv(v(r,C.out[0])),sum_out:nv(v(r,C.out[1])),qty_end:nv(v(r,C.end[0])),sum_end:nv(v(r,C.end[1]))})}

let AR={q:"",from:"",to:"",page:1};

function parseArchive(sheets){
  const out=[];
  sheets.forEach(({name,rows})=>{
    // заголовок: «Наименование ТМЦ» / «Наименование материала» / «Короткое описание МТР»
    const MAT=/наименование\s*(тмц|материала)|короткое\s*описание/;
    const hi=rows.findIndex(r=>r&&r.some(c=>typeof c==="string"&&MAT.test(c.toLowerCase().replace(/\s+/g," "))));if(hi<0)return;
    const H=rows[hi].map(c=>String(c||"").toLowerCase().replace(/ё/g,"е").replace(/\s+/g," ").trim());

    const C={opp:H.findIndex((h,i)=>i!==omts&&(/заявк\S*\s*-?\s*опп/.test(h)||/^№\s*заявк\S*$/.test(h))),omts,applicant:col(/заявитель/),date:col(/дата\s*(заявки|передачи)/)>=0?col(/дата\s*(заявки|передачи)/):col(/^дата/),
      recipient:col(/получатель/),code:col(/шифр/),material:H.findIndex(h=>/наименование\s*(тмц|материала)/.test(h))>=0?H.findIndex(h=>/наименование\s*(тмц|материала)/.test(h)):col(MAT),
      flag:col(/проект\s*\/\s*не/),unit:col(/ед\.?\s*изм/),qty:col(/кол-?во|заказано|количество/),qtyi:col(/^выдано/),transfer:col(/перемещ/),note:col(/примечан/),

        req_date:isoD(g(r,"date")),recipient:xlStr(g(r,"recipient")),project_code:xlStr(g(r,"code")),material:mat,proj_flag:xlStr(g(r,"flag")),unit:xlStr(g(r,"unit")),

  });

async function importArchive(file,onProgress){

// Разбор журнала: колонки ищутся по заголовкам, строки без № акта относятся к предыдущему акту
function parseActs(rows){
  let hi=rows.findIndex(r=>r&&r.some(c=>typeof c==="string"&&/акта/i.test(c))&&r.some(c=>typeof c==="string"&&/поставщик/i.test(c)));
  if(hi<0)throw new Error("Не найдена строка заголовков (№ акта, поставщик, ТОРГ-12).");
  const H=rows[hi].map(c=>String(c||"").toLowerCase());
  const col=(...re)=>H.findIndex(h=>re.every(r=>r.test(h)));
  const C={act_no:col(/№\s*акта/),act_date:col(/дата выдачи/),supplier:col(/поставщик/),torg:col(/торг|упд/),project:col(/шифр/),material:col(/наименование тмц|commodit/),
    unit:col(/единиц/),qty:col(/^количество\/|quantity/),reason:col(/причина/),act_code:col(/код акта/),author:col(/составивший/),doc_status:col(/статус документа/),
    act_status:col(/статус акта/),closed_date:col(/дата закрытия/),note:col(/примечани/),place:col(/на складе/)};
  if(C.act_no<0||C.supplier<0||C.torg<0)throw new Error("В файле нет колонок «№ акта», «Поставщик» или «ТОРГ-12».");

    line++;

      project:xlStr(g(r,"project"))||cur.project,material:mat,unit:xlStr(g(r,"unit")),qty:xlStr(g(r,"qty")),reason:xlStr(g(r,"reason")),act_code:xlStr(g(r,"act_code"))||cur.act_code,
      author:xlStr(g(r,"author"))||cur.author,doc_status:xlStr(g(r,"doc_status")),act_status:xlStr(g(r,"act_status")),closed_date:xlDate(g(r,"closed_date")),note:xlStr(g(r,"note")),place:xlStr(g(r,"place"))});

    res=await api("POST","/api/vs/acts/import",{import_id:id,rows:rows.slice(i,i+N),final:fin,file_name:file.name});

}

      $("#hr").innerHTML=j.items.length?`<div class="tw"><table><tr><th>Дата</th><th>УПД</th><th>Поставщик</th><th>Кладовщик</th><th>Итог</th></tr>
       ${j.items.map(x=>{const s=T.rst[x.status]||[x.status,"gr"];return `<tr style="cursor:pointer" onclick="location.hash='#/receipt/${x.id}'"><td>${dt(x.created)}</td><td><b>${esc(x.upd_number)}</b></td><td>${esc(x.supplier)}</td><td>${esc(uname(x.storekeeper))}</td><td><span class="pill ${s[1]}">${s[0]}</span></td></tr>`}).join("")}</table></div>${pager(j)}`:`<div class="empty">Ничего не найдено</div>`;
    }else{
      if(H.q)f.push(`search_lc~"${String(H.q).toLowerCase().replace(/ё/g,"е").replace(/["\\]/g,"")}"`);
      if(H.tab==="ovr")f.push(`action="override"`);
      const j=await api("GET","/api/collections/activity_log/records?"+new URLSearchParams({page:H.page,perPage:100,sort:"-created",filter:f.join("&&")}));
      $("#hr").innerHTML=j.items.length?`<div class="tw"><table><tr><th>Время</th><th>Кто</th><th>Действие</th></tr>
       ${j.items.map(x=>`<tr ${x.action==="override"?'class="ovr"':""}><td style="white-space:nowrap">${dt(x.created)}</td><td>${esc(x.user_name)}</td><td>${(x.entity==="receipts"||x.entity==="requests")&&x.entity_id?`<a href="#/${x.entity==="receipts"?"receipt":"request"}/${x.entity_id}">${esc(x.summary)}</a>`:esc(x.summary)}
        ${x.action==="update"&&x.details&&typeof x.details==="object"?`<div class="muted">${Object.keys(x.details).map(k=>esc(k)+": «"+esc(x.details[k]["было"])+"» → «"+esc(x.details[k]["стало"])+"»").join("; ")}</div>`:""}</td></tr>`).join("")}</table></div>${pager(j)}`:`<div class="empty">Записей нет</div>`;
    }
    document.querySelectorAll("[data-pg]").forEach(b=>b.onclick=()=>{H.page=+b.dataset.pg;vHistory()});
  }catch(e){$("#hr").innerHTML=`<div class="banner red">${esc(e.message)}</div>`}
}
function pager(j){return j.totalPages>1?`<div class="row noprint" style="margin-top:10px">${j.page>1?`<button class="btn sm" data-pg="${j.page-1}">← Назад</button>`:""}<span class="muted">стр. ${j.page} из ${j.totalPages} (всего ${j.totalItems})</span>${j.page<j.totalPages?`<button class="btn sm" data-pg="${j.page+1}">Далее →</button>`:""}</div>`:`<div class="muted" style="margin-top:8px">Всего: ${j.totalItems}</div>`}

/* ---------- БАЗА ИНСТРУКЦИЙ ---------- */
let RF={q:"",show:"active"};
function vRules(sub){
  const tabs=`<div class="tabs"><a class="tab ${sub==="acts"?"":"on"}" href="#/rules">Правила по УПД</a><a class="tab ${sub==="acts"?"on":""}" href="#/rules/acts">Акты несоответствия</a></div>`;
  if(sub==="acts"){if(!$("#actsbox")){$("#main").innerHTML=`<h1>База ограничений и инструкций</h1>${tabs}<div id="actsbox"></div>`;vActs($("#actsbox"))}return}
  const today=new Date().toISOString().slice(0,10);
  let L=(S.data.rules||[]);
  if(RF.show==="active")L=L.filter(r=>r.active);
  if(RF.q){const q=RF.q.toLowerCase();L=L.filter(r=>[r.upd_number,r.supplier,r.sender,r.description,r.reason].join(" ").toLowerCase().includes(q))}
  const tp=S.data.checklist_templates||[];
  $("#main").innerHTML=`<h1>База ограничений и инструкций</h1>${tabs}
  <div class="card noprint"><div class="row"><div class="grow"><input id="rq" placeholder="Поиск: УПД, поставщик, текст" value="${esc(RF.q)}"></div>
   <select id="rs" style="width:auto"><option value="active" ${RF.show==="active"?"selected":""}>Только активные</option><option value="all" ${RF.show==="all"?"selected":""}>Все</option></select>
   ${can.manage()?`<button class="btn acc" id="rn">＋ Новое правило</button>`:""}</div></div>
  ${L.length?L.map(r=>{const a=T.act[r.action]||[r.action,"gr"];const exp=r.valid_to&&r.valid_to.slice(0,10)<today,fut=r.valid_from&&r.valid_from.slice(0,10)>today;
   return `<div class="card"><div class="row"><span class="pill ${a[1]}">${a[0].toUpperCase()}</span>${!r.active?`<span class="pill gr">НЕАКТИВНО</span>`:""}${exp?`<span class="pill gr">СРОК ИСТЁК</span>`:""}${fut?`<span class="pill gr">ЕЩЁ НЕ ДЕЙСТВУЕТ</span>`:""}
    <span class="muted">версия ${r.version||1}</span></div>
    <div style="margin-top:6px;font-weight:700">${r.upd_number?"УПД № "+esc(r.upd_number):""}${r.upd_number&&(r.supplier||r.sender)?" · ":""}${esc(r.supplier)}${r.sender?" · отправитель: "+esc(r.sender):""}</div>
    <div>${esc(r.description)}</div>${r.reason?`<div class="muted">Причина: ${esc(r.reason)}</div>`:""}
    <div class="muted">${r.action==="approval"?"Согласует: "+(r.approver_role==="admin"?"администратор":"руководитель")+" · ":""}Действует: ${r.valid_from?r.valid_from.slice(0,10).split("-").reverse().join("."):"сразу"} – ${r.valid_to?r.valid_to.slice(0,10).split("-").reverse().join("."):"бессрочно"} · изменил ${esc(uname(r.updated_by||r.created_by))} ${dt(r.updated)}</div>
    ${can.manage()?`<div class="row noprint" style="margin-top:8px"><button class="btn sm" data-re="${r.id}">Изменить</button><button class="btn sm" data-rt="${r.id}">${r.active?"Деактивировать":"Активировать"}</button></div>`:""}</div>`}).join(""):`<div class="card empty">Правил нет</div>`}
  ${can.admin()?`<h2>Шаблон чек-листа приёмки</h2><div class="card">${tp.map(t=>`<div class="chk"><div style="flex:1"><div class="t" style="${t.active?"":"text-decoration:line-through;color:#888"}">${esc(t.title)}</div>
   <div class="muted">порядок ${t.sort} · ${t.required?"обязательный":"необязательный"}${t.active?"":" · отключён"}</div></div><button class="btn sm" data-te="${t.id}">Изменить</button></div>`).join("")}
   <div style="height:8px"></div><button class="btn sm" id="tn">＋ Добавить пункт</button><div class="muted" style="margin-top:6px">Изменения применяются к новым приёмкам.</div></div>`:""}`;
  $("#rq").oninput=e=>{RF.q=e.target.value;clearTimeout(window._rq);window._rq=setTimeout(()=>{vRules();const i=$("#rq");i.focus();i.setSelectionRange(i.value.length,i.value.length)},300)};
  $("#rs").onchange=e=>{RF.show=e.target.value;vRules()};
  const n=$("#rn");if(n)n.onclick=()=>ruleForm(null);
  document.querySelectorAll("[data-re]").forEach(b=>b.onclick=()=>ruleForm(b.dataset.re));
  document.querySelectorAll("[data-rt]").forEach(b=>b.onclick=()=>{const r=S.data.rules.find(x=>x.id===b.dataset.rt);
    if(confirm((r.active?"Деактивировать":"Активировать")+" правило?"))act(b,async()=>{await api("PATCH","/api/collections/rules/records/"+r.id,{active:!r.active});await load(["rules"]);vRules()},"Сохранено")});
  document.querySelectorAll("[data-te]").forEach(b=>b.onclick=()=>tplForm(b.dataset.te));
  const tn=$("#tn");if(tn)tn.onclick=()=>tplForm(null);
}
function ruleForm(id){
  const r=id?S.data.rules.find(x=>x.id===id):{action:"deny",approver_role:"manager",active:true};
  modal(`<h3>${id?"Изменить правило":"Новое правило"}</h3><div class="muted">Заполните хотя бы одно поле: номер УПД, поставщик или отправитель.</div>
  <label class="f">Номер УПД (необязательно)</label><input id="fu" value="${esc(r.upd_number)}">
  <label class="f">Поставщик</label><input id="fs" value="${esc(r.supplier)}"><label class="f">Грузоотправитель</label><input id="fn" value="${esc(r.sender)}">
  <label class="f">Решение *</label><select id="fa"><option value="deny" ${r.action==="deny"?"selected":""}>ЗАПРЕЩЕНО (красный)</option><option value="approval" ${r.action==="approval"?"selected":""}>ТРЕБУЕТСЯ СОГЛАСОВАНИЕ (жёлтый)</option><option value="allow" ${r.action==="allow"?"selected":""}>РАЗРЕШЕНО (зелёный)</option></select>
    <label class="f">Кто согласует</label><select id="fr"><option value="manager" ${r.approver_role!=="admin"?"selected":""}>Руководитель или администратор</option><option value="admin" ${r.approver_role==="admin"?"selected":""}>Только администратор</option></select>
  <label class="f">Инструкция для кладовщика *</label><textarea id="fd">${esc(r.description)}</textarea>
  <label class="f">Причина ограничения</label><input id="fe" value="${esc(r.reason)}">
  <div class="row"><div class="grow"><label class="f">Действует с</label><input id="f1" type="date" value="${r.valid_from?r.valid_from.slice(0,10):""}"></div><div class="grow"><label class="f">Действует по</label><input id="f2" type="date" value="${r.valid_to?r.valid_to.slice(0,10):""}"></div></div>
  <label class="row" style="margin-top:10px;font-weight:600"><input type="checkbox" id="fv" ${r.active?"checked":""}> Правило активно</label>
  <div class="row" style="margin-top:14px"><button class="btn p grow" id="mok">СОХРАНИТЬ</button><button class="btn" data-close>Отмена</button></div>`,
  box=>{$("#mok",box).onclick=e=>act(e.target,async()=>{const v=s=>$(s,box).value.trim();
    const d={upd_number:v("#fu"),supplier:v("#fs"),sender:v("#fn"),action:v("#fa"),approver_role:v("#fr"),description:v("#fd"),reason:v("#fe"),
      valid_from:v("#f1")?v("#f1")+" 00:00:00.000Z":"",valid_to:v("#f2")?v("#f2")+" 00:00:00.000Z":"",active:$("#fv",box).checked};
    if(!d.description)throw new Error("Заполните инструкцию.");
    if(!d.upd_number&&!d.supplier&&!d.sender)throw new Error("Укажите номер УПД, поставщика или отправителя.");
    if(d.valid_from&&d.valid_to&&d.valid_to<d.valid_from)throw new Error("Дата окончания раньше даты начала.");
    await api(id?"PATCH":"POST","/api/collections/rules/records"+(id?"/"+id:""),d);closeModal();await load(["rules"]);vRules()},"Правило сохранено")});
}
function tplForm(id){
  const t=id?S.data.checklist_templates.find(x=>x.id===id):{required:true,active:true,sort:((S.data.checklist_templates||[]).reduce((m,x)=>Math.max(m,x.sort||0),0)+10)};
  modal(`<h3>Пункт чек-листа</h3><label class="f">Текст *</label><textarea id="tt">${esc(t.title)}</textarea>
  <label class="f">Порядок</label><input id="to" type="number" value="${t.sort}">
  <label class="row" style="margin-top:10px;font-weight:600"><input type="checkbox" id="tr" ${t.required?"checked":""}> Обязательный</label>
  <label class="row" style="margin-top:10px;font-weight:600"><input type="checkbox" id="ta" ${t.active?"checked":""}> Активен</label>
  <div class="row" style="margin-top:14px"><button class="btn p grow" id="mok">СОХРАНИТЬ</button><button class="btn" data-close>Отмена</button></div>`,
  box=>{$("#mok",box).onclick=e=>act(e.target,async()=>{const d={title:$("#tt",box).value.trim(),sort:parseInt($("#to",box).value||"0",10),required:$("#tr",box).checked,active:$("#ta",box).checked};
    if(!d.title)throw new Error("Введите текст.");await api(id?"PATCH":"POST","/api/collections/checklist_templates/records"+(id?"/"+id:""),d);closeModal();await load(["checklist_templates"]);vRules()},"Сохранено")});
}

/* ---------- ПОЛЬЗОВАТЕЛИ ---------- */
function vUsers(){
  const U=S.data.users||[];
  $("#main").innerHTML=`<h1>Управление пользователями</h1>
  <div class="row noprint" style="margin-bottom:10px"><button class="btn acc" id="un">＋ Новый пользователь</button></div>
  <div class="card tw"><table><tr><th>Имя</th><th>Логин</th><th>Роль</th><th>Статус</th><th></th></tr>
  ${U.map(u=>`<tr><td><b>${esc(u.name)}</b>${u.warehouse?`<div class="muted">${esc(u.warehouse)}</div>`:""}</td><td>${esc(u.username||u.email)}</td><td>${esc(T.roles[u.role]||u.role)}</td>
   <td>${u.active?`<span class="pill g">АКТИВЕН</span>`:`<span class="pill gr">ОТКЛЮЧЁН</span>`}${u.demo?` <span class="pill y">ТЕСТ</span>`:""}</td><td><button class="btn sm" data-ue="${u.id}">Изменить</button></td></tr>`).join("")}</table></div>
  <h2>Тестовые данные</h2><div class="card"><div class="muted">Создаёт 4 тестовые учётные записи (sklad1, sklad2, ruk1, view1 — пароль Test12345), 3 правила из примеров ТЗ, технику и работников. Удаление убирает тестовые ресурсы и отключает тестовые учётки и правила; история приёмок и журнал сохраняются.</div>
   <div class="row" style="margin-top:10px"><button class="btn" id="dc">Создать тестовые данные</button><button class="btn r" id="dr">Удалить тестовые данные</button></div></div>`;
  $("#un").onclick=()=>userForm(null);
  document.querySelectorAll("[data-ue]").forEach(b=>b.onclick=()=>userForm(b.dataset.ue));
  $("#dc").onclick=e=>act(e.target,async()=>{await api("POST","/api/vs/demo",{action:"create"});await load(Object.keys(LOAD));vUsers()},"Тестовые данные созданы");
  $("#dr").onclick=e=>{if(confirm("Удалить тестовые ресурсы и отключить тестовые учётки?"))act(e.target,async()=>{await api("POST","/api/vs/demo",{action:"remove"});await load(Object.keys(LOAD));vUsers()},"Тестовые данные удалены")};
}
function userForm(id){
  const u=id?S.data.users.find(x=>x.id===id):{role:"storekeeper",active:true};
  modal(`<h3>${id?"Изменить пользователя":"Новый пользователь"}</h3>
  <label class="f">ФИО *</label><input id="uf" value="${esc(u.name)}">
  <label class="f">Логин *</label><input id="ul" value="${esc(u.username)}" autocapitalize="off">
  <label class="f">E-mail *</label><input id="ue" type="email" value="${esc(u.email)}" placeholder="можно служебный: login@velesstroy.local">
  <label class="f">Роль</label><select id="ur">${Object.keys(T.roles).map(k=>`<option value="${k}" ${k===u.role?"selected":""}>${T.roles[k]}</option>`).join("")}</select>
  <label class="f">Склад / участок</label><input id="uw" value="${esc(u.warehouse)}">
  <label class="f">${id?"Новый пароль (оставьте пустым, чтобы не менять)":"Пароль * (не менее 8 символов)"}</label><input id="up" type="text" autocomplete="new-password">
  <label class="row" style="margin-top:10px;font-weight:600"><input type="checkbox" id="ua" ${u.active?"checked":""}> Учётная запись активна</label>
  <div class="row" style="margin-top:14px"><button class="btn p grow" id="mok">СОХРАНИТЬ</button><button class="btn" data-close>Отмена</button></div>`,
  box=>{$("#mok",box).onclick=e=>act(e.target,async()=>{const v=s=>$(s,box).value.trim();
    const d={name:v("#uf"),username:v("#ul"),email:v("#ue")||(v("#ul")+"@velesstroy.local"),role:v("#ur"),warehouse:v("#uw"),active:$("#ua",box).checked};
    if(!d.name||!d.username)throw new Error("Заполните ФИО и логин.");
    const p=$("#up",box).value;if(p){if(p.length<8)throw new Error("Пароль не короче 8 символов.");d.password=p;d.passwordConfirm=p}else if(!id)throw new Error("Задайте пароль.");
    await api(id?"PATCH":"POST","/api/collections/users/records"+(id?"/"+id:""),d);closeModal();await load(["users"]);vUsers()},"Сохранено")});
}

/* ---------- Модальное окно ---------- */
function modal(html,bind){closeModal();const m=document.createElement("div");m.className="modal";m.id="modal";m.innerHTML=`<div class="box">${html}</div>`;
  m.addEventListener("click",e=>{if(e.target===m||e.target.hasAttribute("data-close"))closeModal()});document.body.appendChild(m);
  bind&&bind(m);const f=m.querySelector("input:not([type=checkbox]),textarea,select");if(f&&innerWidth>860)f.focus()}
function closeModal(){const m=$("#modal");if(m)m.remove()}

/* ---------- Старт ---------- */
(function(){let s=null;try{s=JSON.parse(localStorage.getItem("vs_auth")||"null")}catch(_){}
  if(s&&s.t){S.auth=s.t;S.user=s.u;boot()}else drawLogin()})();
</script>
</body>
</html>
