<style>

.spnm{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.spnm div{display:flex;align-items:center;gap:6px}.spnm input{flex:1;min-width:0}.spdot{width:12px;height:12px;border-radius:3px;flex:none}
.sp-ok,.sp-warn{padding:10px 12px;border-radius:8px;font-weight:700}.sp-ok{background:var(--gbg);color:var(--g)}.sp-warn{background:var(--ybg);color:var(--y)}
.spcols{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:12px}@media(max-width:1100px){.spcols{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.spcols{grid-template-columns:1fr}}
.spcol{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:10px;min-width:0}.spcol h3{margin:0;padding:10px 12px 0;overflow-wrap:anywhere}.spcol .sps{padding:2px 12px 8px;font-size:13px;border-bottom:1px solid var(--line)}.spcol .sps b{font-size:20px;color:var(--ink)}
.spcol ol{list-style:none;margin:0;padding:0;max-height:560px;overflow:auto}.spcol li{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:6px 12px;border-bottom:1px dashed var(--line);align-items:center}.spcol li>span:first-child{overflow-wrap:anywhere;min-width:0}.spcol li.top>span:first-child{font-weight:700}.spcol li.hit{background:var(--ybg)}.spm{font-size:12px;white-space:nowrap}.spcol li select{grid-column:1/-1;min-height:30px;padding:2px 6px;font-size:13px}
td.r{text-align:right;font-variant-numeric:tabular-nums}
.g2x{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}@media(max-width:420px){.g2x{grid-template-columns:1fr}}
#toast{pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:90;max-width:92vw;display:flex;flex-direction:column;gap:6px}

#toast div.err{background:var(--r)}#toast div.ok{background:var(--g)}
.modal{position:fixed;inset:0;background:rgba(17,24,39,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px 24px}
.modal h3{margin:0 0 6px;font-size:19px}
.netbar{background:var(--r);color:#fff;text-align:center;font-weight:700;padding:6px;font-size:14px;display:none}
.netbar.show{display:block}
.login{max-width:420px;margin:8vh auto;padding:0 12px}
.login .card{padding:22px}

@media (min-width:860px){
  nav.top{display:flex}nav.bottom{display:none}main{padding-bottom:30px}

}
.modal .box.wide{max-width:900px}
.mzr{display:grid;gap:6px;align-items:center;margin-bottom:6px;padding:6px;background:#f6f7f9;border-radius:8px}.mzr input{min-width:0;width:100%}.mzr .u{white-space:nowrap}
.mzr.i{grid-template-columns:22px minmax(0,1fr) 92px 34px minmax(0,.7fr) 36px}.mzr.p{grid-template-columns:22px minmax(0,1.6fr) minmax(0,.7fr) 60px 84px minmax(0,.8fr) 36px}.mzr .w{grid-column:1/-1}
@media(max-width:700px){.mzr .nn{display:none}.mzr.i{grid-template-columns:minmax(0,1fr) 84px 30px 36px}.mzr.i .it{grid-column:1/-1;grid-row:1}.mzr.i .q{grid-column:2;grid-row:2}.mzr.i .u{grid-column:3;grid-row:2}.mzr.i .n{grid-column:1;grid-row:2}.mzr.i .x{grid-column:4;grid-row:2}
 .mzr.p{grid-template-columns:minmax(0,1fr) 56px 80px 36px}.mzr.p .it{grid-column:1/-1;grid-row:1}.mzr.p .sz{grid-column:1;grid-row:2}.mzr.p .un{grid-column:2;grid-row:2}.mzr.p .q{grid-column:3;grid-row:2}.mzr.p .x{grid-column:4;grid-row:2}.mzr.p .n{grid-column:1/-1;grid-row:3}}
@media print{

<body>
<div class="netbar" id="netbar">НЕТ СВЯЗИ С СЕРВЕРОМ — данные на экране могут быть неактуальны</div>
<div id="app"></div>
<div id="toast"></div>
<script>
"use strict";
/* ВЕЛЕССТРОЙ — клиент. Без внешних библиотек и CDN: работает в России без VPN, грузится только с вашего сервера. */
const T = {
  roles:{admin:"Администратор",manager:"Руководитель",storekeeper:"Кладовщик",viewer:"Просмотр",skk:"СКК (контроль качества)",skk_view:"Наблюдатель склада (только просмотр)",coord:"Участник согласований"},
  rst:{denied:["ПРИЁМКА ЗАПРЕЩЕНА","r"],pending_approval:["ЖДЁТ СОГЛАСОВАНИЯ","y"],rejected:["ОТКАЗАНО","r"],in_progress:["В РАБОТЕ","b"],
       nonconformity:["НЕСООТВЕТСТВИЕ","r"],completed:["ПРИНЯТО","g"],completed_remarks:["ПРИНЯТО С ЗАМЕЧАНИЯМИ","y"]},
  check:{green:"ЗЕЛЁНЫЙ — ПРИЁМКА РАЗРЕШЕНА",red:"КРАСНЫЙ — ПРИЁМКА ЗАПРЕЩЕНА",yellow:"ЖЁЛТЫЙ — ТРЕБУЕТСЯ СОГЛАСОВАНИЕ",notfound:"УПД НЕ НАЙДЕН В БАЗЕ. ТРЕБУЕТСЯ ПРОВЕРКА."},
  act:{allow:["Разрешено","g"],deny:["Запрещено","r"],approval:["Нужно согласование","y"]},
  cat:{crane:"Краны и техника",worker:"Работники (стропальщики)"},
  kind:{document:"Документ",material:"Материал",damage:"Повреждение"}
};
const S = {auth:null,user:null,route:"",data:{},online:true,rt:"wait",fileToken:null,fileTokenAt:0};
const $ = (s,el)=> (el||document).querySelector(s);
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function pd(s){if(!s)return null;const d=new Date(String(s).replace(" ","T"));return isNaN(d)?null:d}
function dt(s){const d=pd(s);return d?d.toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}):"—"}
function tm(s){const d=pd(s);if(!d)return"—";const t=new Date();const same=d.toDateString()===t.toDateString();
  return same?d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}):d.toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}
function dLocalInput(d){const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,16)}
function toast(msg,cls){const box=$("#toast");while(box.children.length>=2)box.firstChild.remove();const el=document.createElement("div");el.textContent=msg;if(cls)el.className=cls;$("#toast").appendChild(el);setTimeout(()=>el.remove(),cls==="err"?6500:3500)}
const can = {
  write:()=>["admin","manager","storekeeper"].includes(role()),
  manage:()=>["admin","manager"].includes(role()),
  admin:()=>role()==="admin"
};
function role(){return S.user?S.user.role:""}
function uname(id){const u=(S.data.users||[]).find(x=>x.id===id);return u?(u.name||u.username):"—"}

/* ---------- API ---------- */
async function api(method,path,body,isForm,opt){
  const h={};if(S.auth)h.Authorization=S.auth;
  if(body&&!isForm)h["Content-Type"]="application/json";
  let r;
  try{r=await fetch(path,{method,headers:h,body:body?(isForm?body:JSON.stringify(body)):undefined,signal:opt&&opt.signal})}
  catch(e){if(e&&e.name==="AbortError"){const er=new Error("Отменено");er.abort=true;throw er}setOnline(false);const er=new Error("Нет связи с сервером. Проверьте интернет и повторите.");er.net=true;throw er}
  setOnline(true);
  let j=null;try{j=await r.json()}catch(_){}
  if(r.status===401&&S.auth){logout(true);throw new Error("Сессия истекла — войдите снова.")}
  if(!r.ok){let m=(j&&j.message)||("Ошибка "+r.status);
    if(j&&j.data&&typeof j.data==="object"){const k=Object.keys(j.data)[0];if(k&&j.data[k]&&j.data[k].message)m+=" ("+k+": "+j.data[k].message+")"}
    if(r.status===403||(r.status===404&&method!=="GET"))m=m.includes("Недостаточно")||m.includes("может дать")?m:"Недостаточно прав для этого действия.";
    // Запрет «⛔»: руководитель / администратор может обойти с объяснением
    if(r.status===409&&m.startsWith("⛔")&&can.manage()&&method==="POST"&&!isForm&&body&&!body.override){
      const why=await askOverride(m);
      if(why)return api(method,path,Object.assign({},body,{override:why}));
      const e2=new Error("Отменено — запрет остался.");e2.status=409;throw e2}
    const err=new Error(m.replace(/^⛔ /,"").replace(/\n⛔ /g,"\n"));err.status=r.status;err.ban=m.startsWith("⛔");throw err}
  return j;
}
function askOverride(msg){return new Promise(res=>{
  const o=document.createElement("div");o.className="modal";o.style.zIndex=70;o.id="ovrm";

  const rs=(S.data.reservations||[]).filter(x=>x.resource===r.id&&(x.status==="reserved"||x.status==="in_work"));
  const cur=rs.filter(x=>x.status==="in_work"||(pd(x.start)<=now&&pd(x.end)>now));
  const next=rs.filter(x=>x.status==="reserved"&&pd(x.start)>now).sort((a,b)=>pd(a.start)-pd(b.start));
  const overdue=rs.filter(x=>pd(x.end)<now);

  return {st,cur,next,overdue,all:rs};
}

  modal(`<h3>${d==="approve"?"Согласовать":"Отказать в приёмке"}</h3><div class="muted">Решение и обоснование будут записаны в журнал с вашим именем и временем.</div>
  <label class="f">Обоснование *</label><textarea id="mc" required></textarea>
  <div class="row" style="margin-top:14px"><button class="btn ${d==="approve"?"g":"r"} grow" id="mok">${d==="approve"?"СОГЛАСОВАТЬ":"ОТКАЗАТЬ"}</button><button class="btn" data-close>Отмена</button></div>`,
  box=>{$("#mok",box).onclick=e=>act(e.target,async()=>{await api("POST","/api/vs/approval/decide",{approval:apId,decision:d,comment:$("#mc",box).value});closeModal();flushAll()},"Решение сохранено")});
}
function openReceipts(){
  const R=(S.data.receipts||[]).filter(x=>["pending_approval","in_progress","nonconformity"].includes(x.status));
  return R.length?R.map(rcRow).join(""):`<div class="empty">Открытых приёмок нет</div>`;
}
function rcRow(x){const s=T.rst[x.status]||[x.status,"gr"];
  return `<a class="it" href="#/receipt/${x.id}" style="color:inherit;text-decoration:none"><div style="flex:1"><b>УПД № ${esc(x.upd_number)}</b> ${x.supplier?"· "+esc(x.supplier):""}
  <div class="muted">${dt(x.created)} · ${esc(uname(x.storekeeper))}</div></div><span class="pill ${s[1]}">${s[0]}</span></a>`}

/* ---------- ПРИЁМКА ---------- */
function vReceive(){
  const sup=[...new Set((S.data.rules||[]).map(r=>r.supplier).concat((S.data.receipts||[]).map(r=>r.supplier)).filter(Boolean))];
  $("#main").innerHTML=`<h1>Приёмка материалов</h1>
  ${can.write()?`<button class="btn acc big noprint" id="rcTun" style="margin-bottom:12px">▶ НОВАЯ ПРИЁМКА — ПО ШАГАМ</button>`:""}
  ${can.write()?`<div class="card"><h2 style="margin-top:0">Новая приёмка <span class="muted" style="font-size:14px;font-weight:400">— быстрая форма (всё сразу)</span></h2>
  <form id="nf"><label class="f">Номер УПД *</label><div class="row" style="gap:8px;flex-wrap:nowrap"><input id="nu" inputmode="text" required placeholder="например 12345" autocomplete="off" style="flex:1">
   <label class="btn acc" style="white-space:nowrap">📄 УПД<input type="file" id="nfu" accept="image/*,application/pdf" multiple hidden></label><label class="btn acc" style="white-space:nowrap">📷 Фото груза<input type="file" id="nfc" accept="image/*" capture="environment" multiple hidden></label></div>
   <div id="nfp" class="row" style="gap:6px;margin-top:6px"></div>
  <label class="f">Поставщик</label><input id="ns" data-sug="supplier" data-chips placeholder="ООО …" autocomplete="off">
  <label class="f">Грузоотправитель (если отличается)</label><input id="nd" data-sug="sender" autocomplete="off">
  <label class="f">Транспорт / госномер</label><input id="nv" data-sug="vehicle" data-chips autocomplete="off">
  <div id="actHint" style="margin-top:10px"></div>
  <div class="muted" style="margin-top:8px">Укажите поставщика — ограничения могут быть заданы по поставщику, а не только по номеру УПД.</div>
  <div style="height:12px"></div><button class="btn p big" id="nb">ПРОВЕРИТЬ УПД</button></form></div>`:`<div class="banner gray">Роль «Просмотр»: создание приёмок недоступно</div>`}
  <h2>Открытые приёмки</h2><div class="card list">${openReceipts()}</div>`;
  sugAttach($("#main"));{const t=$("#rcTun");if(t)t.onclick=()=>tunRecv()}
  // 1.9.12: фото / PDF УПД и фото груза — сразу при создании приёмки
  const NF={upd:[],cargo:[]};const nfp=()=>{const b=$("#nfp");if(b)b.innerHTML=[["upd","📄"],["cargo","📷"]].map(([k,ic])=>NF[k].map((f,i)=>`<span class="pill gr" style="gap:4px">${ic} ${esc(f.name.slice(0,22))} <a href="#" data-nfx="${k}:${i}" aria-label="Убрать">✕</a></span>`).join("")).join("");
    document.querySelectorAll("[data-nfx]").forEach(a=>a.onclick=ev=>{ev.preventDefault();const [k,i]=a.dataset.nfx.split(":");NF[k].splice(+i,1);nfp()})};
  [["#nfu","upd"],["#nfc","cargo"]].forEach(([id,k])=>{const el=$(id);if(el)el.onchange=()=>{NF[k].push(...el.files);el.value="";nfp()}});
  const f=$("#nf");if(f)f.onsubmit=e=>{e.preventDefault();act($("#nb"),async()=>{
    const j=await api("POST","/api/vs/upd/check",{upd:$("#nu").value,supplier:$("#ns").value,sender:$("#nd").value,vehicle:$("#nv").value});
    if(j.existing)toast("По этому УПД уже есть открытая приёмка — открываю её");
    if(j.warning)toast(j.warning,"err");
    let n=0;for(const [k,kind] of [["upd","document"],["cargo","material"]])for(const file of NF[k]){const fd=new FormData();fd.append("receipt",j.receipt);fd.append("kind",kind);fd.append("uploaded_by",S.user.id);fd.append("file",await shrink(file));
      try{await api("POST","/api/collections/attachments/records",fd,true);n++}catch(er){toast("Файл «"+file.name+"» не загрузился: "+er.message,"err")}}
    if(n)toast("Прикреплено файлов: "+n,"ok");
    await load(["receipts"]);location.hash="#/receipt/"+j.receipt})};
  // подсказка по журналу актов: при вводе УПД и поставщика
  let hT=null,hSeq=0;const hint=()=>{clearTimeout(hT);hT=setTimeout(async()=>{const u=$("#nu"),sp=$("#ns"),box=$("#actHint");if(!u||!box)return;
    if(!u.value.trim()){box.innerHTML="";return}const my=++hSeq;
    try{const j=await api("POST","/api/vs/acts/match",{upd:u.value,supplier:sp.value});if(my!==hSeq||!$("#actHint"))return;$("#actHint").innerHTML=actsBanner(j.acts,true)}catch(_){}},500)};
  ["#nu","#ns"].forEach(x=>{const el=$(x);if(el){el.addEventListener("input",hint);el.addEventListener("change",hint)}});
  if($("#nu")&&$("#nu").value)hint();
}
async function fileToken(){if(S.fileToken&&Date.now()-S.fileTokenAt<100000)return S.fileToken;
  const j=await api("POST","/api/files/token");S.fileToken=j.token;S.fileTokenAt=Date.now();return j.token}

/* 1.9.51: удаление приёмки — админ/руководитель, причина обязательна, остаётся запись в журнале */
function rcDelete(r,n){const s=T.rst[r.status]||[r.status,"gr"];
  modal(`<h3>🗑 Удалить приёмку?</h3>
   <div class="card" style="padding:10px"><b>УПД № ${esc(r.upd_number)}</b> <span class="pill ${s[1]}">${s[0]}</span><div class="muted">${esc(r.supplier||"")}${r.sender?" · "+esc(r.sender):""} · создана ${dt(r.created)}</div>
    <div class="muted" style="margin-top:4px">Вместе с ней удалятся: фото и документы — ${n.att}, пункты чек-листа — ${n.items}, согласования — ${n.aps}.</div></div>
   ${r.status==="completed"?`<div class="banner yellow" style="font-size:15px">Приёмка уже завершена. Удаляйте только ошибочную или дубль.</div>`:""}
   <label class="f">Причина удаления (обязательно)</label><input id="rdr" placeholder="дубль / ошибка в УПД / тестовая" autocomplete="off">
   <div class="muted" style="margin-top:6px">В журнал действий запишется, кто, когда и почему удалил. Вернуть можно только из резервной копии.</div>
   <div class="row" style="margin-top:12px;gap:6px"><button class="btn r grow" id="rdok">Удалить навсегда</button><button class="btn" data-close>Отмена</button></div>`,box=>{
   $("#rdok",box).onclick=e=>act(e.target,async()=>{const reason=$("#rdr",box).value.trim();if(reason.length<3){$("#rdr",box).focus();throw new Error("Укажите причину удаления")}
     await api("POST","/api/vs/receipt/delete",{receipt:r.id,reason});closeModal();S.cur=null;await load(["receipts"]);location.hash="#/receive"},"Приёмка удалена")})}
async function vReceipt(id,changedCols){
  let r=(S.data.receipts||[]).find(x=>x.id===id);
  try{if(!r||!changedCols||changedCols.some(c=>["receipts","checklist_items","attachments","approvals"].includes(c))){
    r=await api("GET","/api/collections/receipts/records/"+id);
    S.cur={r,items:await all("checklist_items",`receipt="${id}"`,"sort"),att:await all("attachments",`receipt="${id}"`,"created"),
      aps:await all("approvals",`receipt="${id}"`,"created")};
  }}catch(e){$("#main").innerHTML=`<div class="banner red">${esc(e.message)}</div>`;return}
  if(!S.cur||S.cur.r.id!==id||S.route!=="receipt/"+id)return; // пользователь уже ушёл на другой экран
  const {items,att,aps}=S.cur;r=S.cur.r;
  const W=can.write(),st=r.status,open=st==="in_progress";
  const bc={green:"green",red:"red",yellow:"yellow",notfound:"notfound"}[r.check_result]||"gray";
  const pendAp=aps.find(a=>a.status==="pending");
  const rules=Array.isArray(r.rule_ids)?r.rule_ids:[];
  const s=T.rst[st]||[st,"gr"];
  const done=items.filter(i=>i.done).length,reqOpen=items.filter(i=>i.required&&!i.done).length;
  let ft="";try{if(att.length)ft=await fileToken()}catch(_){}
  if(S.route!=="receipt/"+id)return;
  $("#main").innerHTML=`<div class="row noprint" style="margin-bottom:8px"><a class="btn sm" href="#/receive">← К приёмкам</a><div class="grow"></div><button class="btn sm" onclick="print()">Печать / PDF</button>${can.manage()&&!S.user.scope?`<button class="btn sm r" id="rcDel" title="Удалить приёмку (ошибочную, дубль)">🗑 Удалить</button>`:""}</div>
  <h1>УПД № ${esc(r.upd_number)} <span class="pill ${s[1]}" style="vertical-align:middle">${s[0]}</span></h1>
  <div class="banner ${bc}">${esc(T.check[r.check_result]||"")}<small>${esc(r.instruction||(r.check_result==="notfound"?"Для этого УПД, поставщика и отправителя в базе нет правил. Приёмка возможна только после проверки и согласования руководителем.":""))}</small></div>
  ${actsBanner(Array.isArray(r.acts_found)?r.acts_found:[],false)}
  ${r.memo_required?(r.memo_done_at?`<div class="card" style="border-color:var(--v)"><b style="color:var(--v)">✔ Служебная записка написана</b><div class="muted">${esc(uname(r.memo_done_by))}, ${dt(r.memo_done_at)}${r.memo_comment?" — «"+esc(r.memo_comment)+"»":""}</div></div>`
    :W?`<div class="card noprint" style="border-color:var(--v)"><label class="f">Служебная записка (№, комментарий)</label><input id="memoC" placeholder="например: СЗ № 15 от 03.11 на начальника склада"><div style="height:8px"></div><button class="btn big" id="memoB" style="border-color:var(--v);color:var(--v)">✍ СЛУЖЕБНАЯ ЗАПИСКА НАПИСАНА</button></div>`:""):""}
  ${st==="denied"?`<div class="banner red">ПРИЁМКА ОСТАНОВЛЕНА<small>Не принимайте груз. Сообщите руководителю. Если ограничение снято, руководитель меняет правило в «Базе инструкций», после чего УПД проверяется заново.</small></div>`:""}
  ${(st==="denied"||st==="rejected")&&can.manage()?`<div class="card noprint"><button class="btn o big" id="rcAllow">⚠ РАЗРЕШИТЬ ПРИЁМКУ В ОБХОД ЗАПРЕТА</button><div class="muted" style="margin-top:6px">Нужно объяснение. Запишется в журнал и будет видно начальнику.</div></div>`:""}
  ${ovrBlock(r.overrides)}
  ${st==="rejected"?`<div class="banner red">В ПРИЁМКЕ ОТКАЗАНО<small>${esc((aps.filter(a=>a.status==="rejected").pop()||{}).decision_comment||r.nc_decision||"")}</small></div>`:""}
  ${st==="nonconformity"?`<div class="banner red">ОБНАРУЖЕНО НЕСООТВЕТСТВИЕ<small>${esc(r.nc_description)}\nПриёмка остановлена до решения руководителя.</small></div>`:""}
  <div class="card"><div class="kv">
   <b>Поставщик</b><span>${esc(r.supplier||"—")}</span><b>Отправитель</b><span>${esc(r.sender||"—")}</span>
   <b>Транспорт</b><span>${esc(r.vehicle||"—")}</span><b>Проверка</b><span>${dt(r.created)}</span>
   <b>Кладовщик</b><span>${esc(uname(r.storekeeper))}</span>${r.finished_at?`<b>Закрыта</b><span>${dt(r.finished_at)}</span>`:""}
   ${r.nc_decision?`<b>Решение</b><span>${esc(r.nc_decision)}</span>`:""}
  </div>
  ${rules.length?`<div class="muted" style="margin-top:8px">Сработавшие правила: ${rules.map(x=>`<span class="pill ${(T.act[x.action]||["","gr"])[1]}">${esc((T.act[x.action]||[x.action])[0])}</span> ${esc(x.description)} (по ${x.by==="upd"?"номеру УПД":x.by==="supplier"?"поставщику":"отправителю"}, версия ${x.version})`).join("; ")}</div>`:""}</div>
  ${st==="pending_approval"?`<div class="card"><h2 style="margin-top:0">Согласование</h2>
    ${pendAp?`<div class="banner yellow">ЗАПРОС ОТПРАВЛЕН — ЖДИТЕ РЕШЕНИЯ<small>Отправлен ${dt(pendAp.created)} (${esc(uname(pendAp.requested_by))}). Согласовать может: ${pendAp.approver_role==="admin"?"администратор":"руководитель или администратор"}.</small></div>
      ${can.manage()&&(pendAp.approver_role!=="admin"||can.admin())?`<div class="row"><button class="btn g grow" data-ap="${pendAp.id}" data-d="approve">СОГЛАСОВАТЬ</button><button class="btn r grow" data-ap="${pendAp.id}" data-d="reject">ОТКАЗАТЬ</button></div>`:""}`
    :W?`<label class="f">Комментарий для руководителя</label><textarea id="rqc" placeholder="например: машина стоит у ворот 3"></textarea>
      <div style="height:10px"></div><button class="btn acc big" id="rqb">ОТПРАВИТЬ ЗАПРОС НА СОГЛАСОВАНИЕ</button>`:`<div class="muted">Запрос ещё не отправлен</div>`}</div>`:""}
  ${st==="nonconformity"&&pendAp&&can.manage()?`<div class="card row"><button class="btn g grow" data-ap="${pendAp.id}" data-d="approve">ПРИНЯТЬ С ЗАМЕЧАНИЯМИ</button><button class="btn r grow" data-ap="${pendAp.id}" data-d="reject">ОТКАЗАТЬ В ПРИЁМКЕ</button></div>`:""}
  ${items.length?`<div class="card"><h2 style="margin-top:0">Чек-лист приёмки <span class="muted">${done} из ${items.length}</span></h2>
   ${items.map(i=>`<div class="chk ${i.done?"done":""}"><input type="checkbox" data-it="${i.id}" ${i.done?"checked":""} ${open&&W?"":"disabled"} aria-label="${esc(i.title)}">
   <div style="flex:1"><div class="t">${esc(i.title)}${i.required?"":" <span class='muted'>(необязательно)</span>"}</div>
   ${i.done?`<div class="muted">✔ ${esc(uname(i.done_by))}, ${dt(i.done_at)}</div>`:""}
   ${open&&W?`<input data-cm="${i.id}" id="cm_${i.id}" placeholder="Комментарий" value="${esc(i.comment)}" style="min-height:40px;margin-top:6px">`:i.comment?`<div class="muted">Комментарий: ${esc(i.comment)}</div>`:""}</div></div>`).join("")}</div>`:""}
  ${(open||st==="pending_approval")&&W?`<div class="card"><h2 style="margin-top:0">Количество и замечания</h2>
   <div class="row"><div class="grow"><label class="f">Кол-во по УПД</label><input id="qd" value="${esc(r.qty_doc)}"></div><div class="grow"><label class="f">Фактически</label><input id="qf" value="${esc(r.qty_fact)}"></div></div>
   <label class="f">Повреждения</label><input id="dm" value="${esc(r.damage)}"><label class="f">Примечание</label><textarea id="nt">${esc(r.notes)}</textarea>
   <div style="height:10px"></div><button class="btn" id="sv">Сохранить данные</button></div>`
   :(r.qty_doc||r.qty_fact||r.damage||r.notes)?`<div class="card kv"><b>Кол-во по УПД</b><span>${esc(r.qty_doc||"—")}</span><b>Фактически</b><span>${esc(r.qty_fact||"—")}</span><b>Повреждения</b><span>${esc(r.damage||"—")}</span><b>Примечание</b><span>${esc(r.notes||"—")}</span></div>`:""}
  ${Array.isArray(r.upd_items)&&r.upd_items.length?`<div class="card"><h2 style="margin-top:0">📄 Материалы по УПД <span class="muted">${r.upd_items.length} поз.${r.upd_date?" · от "+esc(r.upd_date.split("-").reverse().join(".")):""}</span></h2>
   <div style="overflow:auto"><table class="tbl"><tr><th>№</th><th>Наименование</th><th style="text-align:right">Кол-во</th><th>Ед.</th></tr>${r.upd_items.map((x,k)=>`<tr><td>${esc(String(x.no||k+1))}</td><td>${esc(x.name)}</td><td style="text-align:right"><b>${x.qty==null?"—":fmtQ(x.qty)}</b></td><td>${esc(x.unit||"")}</td></tr>`).join("")}</table></div></div>`:""}
  <div class="card"><h2 style="margin-top:0">Фото и документы (${att.length})</h2>
   <div class="photos">${att.map(a=>{const u="/api/files/attachments/"+a.id+"/"+encodeURIComponent(a.file)+"?token="+ft;const img=/\.(jpe?g|png|webp)$/i.test(a.file);
     return `<a href="${u}" target="_blank" rel="noopener">${img?`<img src="${u}&thumb=200x200" alt="">`:`<div style="padding:30px 8px;text-align:center">PDF</div>`}<span>${esc(T.kind[a.kind]||"")}</span></a>`}).join("")||`<div class="muted">Нет файлов</div>`}</div>
   ${W&&(open||st==="pending_approval"||st==="nonconformity")?`<div class="row noprint" style="margin-top:10px"><select id="pk" style="width:auto;flex:1"><option value="document">Документ (УПД, ТТН)</option><option value="material">Материал</option><option value="damage">Повреждение</option></select>
   <label class="btn acc" style="flex:1">📷 Сфотографировать<input type="file" id="pf" accept="image/*,application/pdf" capture="environment" hidden></label>
   <label class="btn" style="flex:1">Из галереи<input type="file" id="pg" accept="image/*,application/pdf" multiple hidden></label></div>`:""}</div>
  ${open&&W?`<div class="card noprint"><button class="btn g big" id="cb" ${reqOpen?"":""}>ЗАВЕРШИТЬ ПРИЁМКУ</button>
   ${reqOpen?`<div class="muted" style="margin-top:6px">Осталось обязательных пунктов: ${reqOpen}</div>`:""}
   <div style="height:10px"></div><button class="btn r big" id="ncb">ОБНАРУЖЕНО НЕСООТВЕТСТВИЕ</button></div>`:""}
  ${aps.length?`<div class="card"><h2 style="margin-top:0">История согласований</h2><div class="tw"><table><tr><th>Тип</th><th>Запрос</th><th>Решение</th></tr>
   ${aps.map(a=>`<tr><td>${esc({approval:"Согласование",notfound:"УПД не найден",nonconformity:"Несоответствие"}[a.kind])}</td>
   <td>${esc(uname(a.requested_by))}<br><span class="muted">${dt(a.created)}</span>${a.request_comment?"<br>«"+esc(a.request_comment)+"»":""}</td>
   <td>${a.status==="pending"?`<span class="pill y">ОЖИДАЕТ</span>`:`<span class="pill ${a.status==="approved"?"g":"r"}">${a.status==="approved"?"СОГЛАСОВАНО":"ОТКАЗАНО"}</span><br>${esc(uname(a.decided_by))}, ${dt(a.decided_at)}<br>«${esc(a.decision_comment)}»`}</td></tr>`).join("")}</table></div></div>`:""}`;
  bindAp();
  const rd=$("#rcDel");if(rd)rd.onclick=()=>rcDelete(r,{att:att.length,items:items.length,aps:aps.length});
  const ra=$("#rcAllow");if(ra)ra.onclick=e=>act(e.target,async()=>{await api("POST","/api/vs/receipt/allow",{receipt:id});S.cur=null;await load(["receipts"]);vReceipt(id,["receipts"])},"Приёмка разрешена");
  const mb=$("#memoB");if(mb)mb.onclick=e=>act(e.target,async()=>{await api("POST","/api/vs/receipt/memo",{receipt:id,comment:$("#memoC").value});S.cur=null;await load(["receipts"]);vReceipt(id,["receipts"])},"Отмечено");
  const rq=$("#rqb");if(rq)rq.onclick=e=>act(e.target,async()=>{await api("POST","/api/vs/approval/request",{receipt:id,comment:$("#rqc").value});render(["approvals"])},"Запрос отправлен руководителю");
  document.querySelectorAll("[data-it]").forEach(c=>c.onchange=()=>{const cm=$(`[data-cm="${c.dataset.it}"]`);
    act(null,async()=>{await api("POST","/api/vs/checklist/set",{item:c.dataset.it,done:c.checked,comment:cm?cm.value:undefined});render(["checklist_items"])}).then(()=>{})});

async function shrink(file){
  if(!/^image\/(jpeg|png|webp)/.test(file.type)||file.size<400000)return file;
  try{const bmp=await createImageBitmap(file);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(res=>c.toBlob(res,"image/jpeg",.8));return b?new File([b],file.name.replace(/\.\w+$/,"")+".jpg",{type:"image/jpeg"}):file}catch(_){return file}
}

async function mzParse(f){const x=await readXlsx(f);const out=[];
  for(const sh of x.sheets){const rows=await x.rows(sh);let hi=-1,H=[];
    for(let i=0;i<Math.min(rows.length,20);i++){const r=(rows[i]||[]).map(c=>String(c==null?"":c).replace(/\s+/g," ").trim().toLowerCase());if(r.some(c=>/наименование/.test(c))&&r.some(c=>/^(остаток|количество|кол-во|факт|наличие)/.test(c))){hi=i;H=r;break}}
    if(hi<0)continue;const fi=re=>H.findIndex(h=>re.test(h));
    const ci={name:fi(/наименование/),size:fi(/^размер|марка|диаметр/),unit:fi(/^ед/),qty:H.findIndex(h=>/^остаток/.test(h))>=0?H.findIndex(h=>/^остаток/.test(h)):fi(/^(количество|кол-во|факт|наличие)/),min:fi(/мин/),grp:fi(/^(группа|сезон|уточнение|вид)/),place:fi(/^место/),code:fi(/^(код|инв|артикул)/)};
    let g="";for(let i=hi+1;i<rows.length;i++){const r=rows[i]||[];const v=k=>ci[k]>=0?r[ci[k]]:"";const nm=xlStr(v("name"));if(ci.grp>=0&&xlStr(v("grp")))g=xlStr(v("grp"));if(!nm)continue;
      const q=v("qty");out.push({sheet:sh.name,grp:g||"",name:nm,size:xlStr(v("size")),unit:xlStr(v("unit")),qty:q===""||q==null?"":typeof q==="number"?q:xlStr(q),min:v("min")===""?"":v("min"),place:xlStr(v("place")),code:xlStr(v("code"))})}}
  return out}

  const T={cfg,c,get i(){return i}};TUNS.cur=T;
  const paint=async()=>{const V=vis();if(!V.includes(i)){const nx=V.find(k=>k>i);i=nx==null?V[V.length-1]:nx}
    const st=cfg.steps[i],pos=V.indexOf(i)+1,last=pos===V.length;

    sugAttach(box);
    const go=async(dir,btn)=>{if(dir>0&&st.read)st.read(box,c);if(dir<0&&st.read)try{st.read(box,c)}catch(_){}
      if(dir>0&&st.check){const er=st.check(c);if(er)throw new Error(er)}
      if(dir>0&&st.save)await st.save(c,T);
      if(dir>0&&last){await cfg.done(c,T);tunClose();return}
      const V2=vis(),p2=V2.indexOf(i);const n=V2[p2+dir];if(n!=null){i=n;paint()}};

/* 1.9.55: прочитать УПД при приёмке — как скан заявки: PDF или несколько фото (фото склеиваются в один PDF, по листу на фото) */
const fmtRub=v=>(+v||0).toLocaleString("ru-RU",{minimumFractionDigits:2,maximumFractionDigits:2});
async function toJpeg(file,max){const bmp=await createImageBitmap(file);const k=Math.min(1,max/Math.max(bmp.width,bmp.height));const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,"image/jpeg",0.92));if(!b)throw new Error("Фото «"+file.name+"» не открылось.");return {b,w:c.width,h:c.height}}
async function photosToPdf(files){const enc=s=>new TextEncoder().encode(s);const parts=[];let len=0;const off=[];
  const push=x=>{const u=typeof x==="string"?enc(x):x;parts.push(u);len+=u.length};const objs=[];   // объекты: [номер, функция-запись]
  const imgs=[];for(const f of files)imgs.push(await toJpeg(f,3400));
  const n=imgs.length,pages=[];   // 1 — каталог, 2 — страницы, дальше по 3 объекта на фото
  push("%PDF-1.4\n%\xE2\xE3\n");
  const obj=(id,body,stream)=>{off[id]=len;push(id+" 0 obj\n"+body);if(stream){push("\nstream\n");push(stream);push("\nendstream")}push("\nendobj\n")};
  obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
  for(let i=0;i<n;i++)pages.push(5+i*3);
  obj(2,`<< /Type /Pages /Kids [${pages.map(p=>p+" 0 R").join(" ")}] /Count ${n} >>`);
  for(let i=0;i<n;i++){const im=imgs[i],id=3+i*3,W=(im.w*72/300).toFixed(2),H=(im.h*72/300).toFixed(2);const data=new Uint8Array(await im.b.arrayBuffer());
    obj(id,`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${data.length} >>`,data);
    const cs=`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;obj(id+1,`<< /Length ${cs.length} >>`,enc(cs));
    obj(id+2,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${id} 0 R >> >> /Contents ${id+1} 0 R >>`)}
  const total=3+n*3,xr=len;let x=`xref\n0 ${total}\n0000000000 65535 f \n`;for(let i=1;i<total;i++)x+=String(off[i]).padStart(10,"0")+" 00000 n \n";
  push(x+`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xr}\n%%EOF\n`);
  return new File(parts,"UPD_foto_"+n+".pdf",{type:"application/pdf"})}
async function updRead(files,say){const pdf=files.find(f=>/pdf/i.test(f.type)||/\.pdf$/i.test(f.name||""));
  let f;if(pdf)f=pdf;else if(files.length===1)f=(await toJpeg(files[0],3400)).b;else{say("⏳ Склеиваю фото в один документ…");f=await photosToPdf(files)}
  if(!(f instanceof File))f=new File([f],"UPD_foto.jpg",{type:"image/jpeg"});
  say("⏳ Загружаю УПД…");const fd=new FormData();fd.append("status","draft");fd.append("uploaded_by",S.user.id);fd.append("file",f);
  const rec=await api("POST","/api/collections/upd_docs/records",fd,true);
  await api("POST","/api/vs/upd/ocr",{id:rec.id});const t0=Date.now();
  for(;;){await new Promise(r=>setTimeout(r,2500));const s=await api("GET","/api/vs/upd/ocr_status/"+rec.id);
    say("⏳ Читаю УПД"+(s.pages?` — лист ${s.page} из ${s.pages}`:"")+"… обычно 1–3 минуты");
    if(s.status==="done")break;if(s.status==="error"||s.status==="none")throw new Error(s.message||"чтение не запустилось");if(Date.now()-t0>620000)throw new Error("чтение не закончилось за 10 минут")}
  const u=await api("GET","/api/collections/upd_docs/records/"+rec.id);const o=u.ocr||{},h=o.header||{};
  let sup=h.seller||"";if(sup){const fx=fixSuppliers([sup],o.known_suppliers||[]);if(fx[0]&&fx[0].v)sup=fx[0].v}
  return {id:rec.id,number:h.number||"",date:h.date||"",supplier:sup,items:(o.items||[]).map(x=>({name:x.name||"",unit:x.unit||"",qty:x.qty==null?"":x.qty,no:x.no})),check:o.check||{}}}

async function mzNormParse(f){const x=await readXlsx(f);const out={work:[],issue:[]};const H=s=>lcq(xlStr(s)).replace(/\s+/g," ").trim();
  for(const sh of x.sheets){const rows=await x.rows(sh);let hi=-1,C={};
    for(let i=0;i<Math.min(rows.length,25);i++){const r=[...(rows[i]||[])].map(H);const nm=r.findIndex(v=>/наимен|материал|инструмент|позиция/.test(v)),q=r.findIndex(v=>/норм|расход|кол-?во|количество/.test(v));
      if(nm>=0&&q>=0){hi=i;C={name:nm,qty:q,work:r.findIndex(v=>/вид работ|работ[аы]?$|^работы/.test(v)),wu:r.findIndex(v=>/ед\.? ?работ|единица работ/.test(v)),size:r.findIndex(v=>/размер|марка|диаметр/.test(v)),
        unit:r.findIndex((v,k)=>/^ед\.?( изм\.?)?$|единица/.test(v)&&!/работ/.test(v)&&k!==nm),days:r.findIndex(v=>/период|срок|дн/.test(v)),per:r.findIndex(v=>/на кого|кому|на бригад|на человек/.test(v)),note:r.findIndex(v=>/примеч/.test(v))};break}}
    if(hi<0)continue;let lastW="",lastWU="";
    for(const r of rows.slice(hi+1)){if(!r)continue;const g=k=>k>=0?xlStr(r[k]).trim():"";const name=g(C.name);const q=num(g(C.qty));if(!name||!g(C.qty))continue;
      const w=g(C.work)||(C.work>=0?lastW:"");if(C.work>=0&&g(C.work))lastW=g(C.work);const wu=g(C.wu)||(C.wu>=0?lastWU:"");if(C.wu>=0&&g(C.wu))lastWU=g(C.wu);
      const o={name,size:g(C.size),unit:g(C.unit),qty:q,note:g(C.note)};
      if(C.work>=0&&w)out.work.push(Object.assign(o,{work:w,work_unit:wu}));else out.issue.push(Object.assign(o,{period_days:num(g(C.days))||30,per:g(C.per)}))}}
  return out}

const CDF={q:"",st:{},need:false,stock:false,extra:true};

     <td>${g.oper.length?g.oper.slice(0,3).map(o=>`<div>${esc(o.name)} — ${fmtQ(o.delivered)} из ${fmtQ(o.qty)} ${esc(o.unit)}${o.torg?` <span class="muted">· ${esc(o.torg)}</span>`:""}</div>${eso(o)}`).join("")+(g.oper.length>3?`<div class="muted">… ещё ${g.oper.length-3}</div>`:""):'<span class="muted">в оперативке под шифр нет</span>'}</td>
     <td><span class="pill ${CST[g.st][1]}">${CST[g.st][0]}</span></td></tr>`).join("")||'<tr><td colspan="7" class="muted">Заявок с этим шифром нет.</td></tr>'}</table></div>
   ${R.extra.length?`<div class="card" style="margin-top:10px"><b>Поставлено под шифр, а заявок на это нет — ${R.extra.length}</b><div class="tw" style="margin-top:6px"><table><tr><th>Материал (оперативка)</th><th>Поставлено</th><th>УПД / сводный</th><th>На складе (МПЗ)</th></tr>${R.extra.map(o=>`<tr><td>${esc(o.name)}</td><td>${fmtQ(o.delivered)} из ${fmtQ(o.qty)} ${esc(o.unit)}</td><td>${esc(o.torg||"")}${eso(o)}</td><td><b style="color:${o.stock>0?"var(--g)":"inherit"}">${fmtQ(o.stock)}</b>${o.mpz.length?`<div class="muted">${esc(o.mpz[0].name)}</div>`:""}</td></tr>`).join("")}</table></div></div>`:""}
   <div class="muted" style="margin-top:6px">Названия сравниваются по словам и размерам (не дословно), поэтому проверяйте строки «${CST.part[0].toLowerCase()}» и «${CST.gone[0].toLowerCase()}» глазами. На складе — по последней выгрузке МПЗ, для всех шифров вместе.</div>`}
function codesExcel(R){const T=XS.cC;const ST={stock:XS.cG,part:XS.sY,gone:XS.sY,none:XS.cR,issued:T};

    {v:g.oper.slice(0,3).map(o=>o.name+": "+o.delivered+" из "+o.qty+" "+o.unit).join("; "),s:T},{v:g.oper.slice(0,3).map(o=>o.torg).filter(Boolean).join("; "),s:T},{v:g.oper.flatMap(o=>o.eso).slice(0,3).map(u=>(u.keeper||"")+" "+dmy(u.date)).join("; "),s:T},{v:g.reqs.map(r=>r.no).filter(Boolean).slice(0,15).join(", "),s:T},{v:CST[g.st][0],s:ST[g.st]}]));

async function copyText(t){try{await navigator.clipboard.writeText(t)}catch(_){const a=document.createElement("textarea");a.value=t;a.style.position="fixed";a.style.opacity=0;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(_){}a.remove()}toast("Скопировано","ok")}

// Картинка задачи: текст + фото на одном JPEG
async function stropCard(text,photo){
  const W=1080,P=48,c=document.createElement("canvas"),x=c.getContext("2d");x.font="36px sans-serif";
  const wrap=(s,font,max)=>{x.font=font;const out=[];s.split("\n").forEach(par=>{let ln="";par.split(" ").forEach(w=>{const t=ln?ln+" "+w:w;if(x.measureText(t).width>max&&ln){out.push(ln);ln=w}else ln=t});out.push(ln)});return out};
  const lines=text.split("\n");const head=lines.shift();const body=wrap(lines.join("\n"),"36px sans-serif",W-2*P);
  let img=null,ih=0;if(photo){img=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=URL.createObjectURL(photo)});if(img)ih=Math.min(1100,Math.round(img.height*(W-2*P)/img.width))}
  c.width=W;c.height=130+body.length*48+P+(img?ih+P:0)+40;
  x.fillStyle="#fff";x.fillRect(0,0,W,c.height);x.fillStyle="#14181f";x.fillRect(0,0,W,110);x.fillStyle="#f2b705";x.fillRect(0,110,W,8);
  x.fillStyle="#fff";x.font="bold 42px sans-serif";x.fillText(head,P,70);
  let y=170;body.forEach(l=>{const m=l.match(/^([^:]{2,20}):\s(.*)$/);x.fillStyle="#14181f";
    if(m){x.font="bold 36px sans-serif";x.fillText(m[1]+":",P,y);const w=x.measureText(m[1]+": ").width;x.font="36px sans-serif";x.fillText(m[2],P+w,y)}else{x.font="36px sans-serif";x.fillText(l,P,y)}y+=48});
  if(img){y+=10;x.drawImage(img,P,y,W-2*P,ih);y+=ih}
  x.fillStyle="#5b6472";x.font="24px sans-serif";x.fillText("ВЕЛЕССТРОЙ",P,c.height-20);
  return await new Promise(r=>c.toBlob(r,"image/jpeg",.85));
}

const SP={F:[],FILES:{},names:null,metric:"pdf",topn:20,mode:"random",seed:Date.now()%100000,manual:{},q:"",opened:null,msg:""};
(function(){try{const n=JSON.parse(localStorage.getItem("vs_split_names")||"null");if(Array.isArray(n)&&n.length===5)SP.names=n}catch(_){}
  if(!SP.names)SP.names=["Учётчица 1","Учётчица 2","Учётчица 3","Учётчица 4","Учётчица 5"]})();
const MB=b=>(b/1048576).toFixed(1).replace(".",",");
function spRng(s){return()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296}}
function spMetric(f){return SP.metric==="size"?f.pdf_bytes:SP.metric==="files"?f.files:f.pdf}
function spCompute(){
  const L=SP.F.filter(f=>f.on).sort((a,b)=>spMetric(b)-spMetric(a)||a.name.localeCompare(b.name,"ru"));
  const T=L.length,base=Math.floor(T/5),rem=T%5,quota=[0,1,2,3,4].map(i=>base+(i<rem?1:0));
  const topN=Math.min(Math.max(0,SP.topn|0),T),asg=new Map(),cnt=[0,0,0,0,0],load=[0,0,0,0,0];
  const put=(f,p)=>{asg.set(f,p);cnt[p]++;load[p]+=spMetric(f)};
  // самые большие — «змейкой» 1-2-3-4-5-5-4-3-2-1
  for(let i=0;i<topN;i++){const r=Math.floor(i/5),k=i%5;let p=r%2?4-k:k;if(cnt[p]>=quota[p])p=cnt.findIndex((c,j)=>c<quota[j]);put(L[i],p)}
  const rest=L.slice(topN);
  if(SP.mode==="load"){rest.forEach(f=>{let best=-1;for(let p=0;p<5;p++)if(cnt[p]<quota[p]&&(best<0||load[p]<load[best]))best=p;put(f,best)})}
  else{const r=spRng(SP.seed);for(let i=rest.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[rest[i],rest[j]]=[rest[j],rest[i]]}
    let p=0;rest.forEach(f=>{while(cnt[p]>=quota[p])p=(p+1)%5;put(f,p);p=(p+1)%5})}
  Object.entries(SP.manual).forEach(([n,q])=>{const f=L.find(x=>x.name===n);if(f)asg.set(f,q)});
  return {L,topN,asg,quota,rank:new Map(L.map((f,i)=>[f,i+1]))};
}
// чтение папок: перетаскивание (много папок сразу) или выбор общей папки
async function spWalk(entry,path,out,prog){
  if(entry.isFile){try{const f=await new Promise((res,rej)=>entry.file(res,rej));out.push({rel:path+entry.name,name:entry.name,size:f.size,mtime:f.lastModified});if(out.length%200===0)prog(out.length)}catch(_){}return}
  const rd=entry.createReader();let b;do{b=await new Promise((res,rej)=>rd.readEntries(res,rej));await Promise.all(b.map(e=>spWalk(e,path+entry.name+"/",out,prog)))}while(b.length);
}
function spFolder(name,files){const x={name,files:0,pdf:0,pdf_bytes:0,bytes:0,on:true};
  files.forEach(f=>{x.files++;x.bytes+=f.size;if(/\.pdf$/i.test(f.name)){x.pdf++;x.pdf_bytes+=f.size}});return x}
// одна общая папка, в которой лежат только папки — значит, поставщики внутри неё
// Одна перетащенная папка: если внутри 5+ папок — это общая папка, поставщики внутри (файлы прямо в ней не считаются).
// Кнопкой можно переключить: «это один поставщик» / «разделить по папкам внутри».
function spSplitGroup(g){const by={},root=[];g.files.forEach(f=>{const p=f.rel.split("/");if(p.length>2)(by[p[1]]=by[p[1]]||[]).push(f);else root.push(f)});
  return {groups:Object.entries(by).map(([n,fs])=>({name:n,files:fs})),root}}
// папка-обёртка с одной папкой внутри и без файлов — заходим глубже
function spDescend(g){const sp=spSplitGroup(g);if(sp.groups.length===1&&!sp.root.length)return spDescend({name:sp.groups[0].name,files:sp.groups[0].files.map(f=>({...f,rel:f.rel.split("/").slice(1).join("/")}))});return g}
function spAdd(groups,mode){let added=0,upd=0,note="";SP.undo=null;
  if(groups.length===1){const g=mode==="single"?groups[0]:spDescend(groups[0]);const sp=spSplitGroup(g);
    if(mode==="parent"||(mode!=="single"&&sp.groups.length>=5)){groups=sp.groups;
      note=`Папка «${g.name}» — общая: внутри ${groups.length} папок поставщиков`+(sp.root.length?` (файлов прямо в ней: ${sp.root.length} — не учтены)`:"")+". ";
      SP.undo={raw:g,as:"parent",names:groups.map(x=>x.name)}}
    else if(sp.groups.length>=2)SP.undo={raw:g,as:"single",names:[g.name]}}
  groups.forEach(g=>{SP.FILES[g.name]=g.files;const x=spFolder(g.name,g.files);const i=SP.F.findIndex(f=>f.name===g.name);if(i>=0){x.on=SP.F[i].on;SP.F[i]=x;upd++}else{SP.F.push(x);added++}});
  SP.opened=null;SP.manual={};SP.msg=note+`Добавлено папок: ${added}`+(upd?`, обновлено: ${upd}`:"")+`. Всего: ${SP.F.length}.`;vSplit();
}
function spToggle(){const u=SP.undo;if(!u)return;SP.F=SP.F.filter(f=>!u.names.includes(f.name));spAdd([u.raw],u.as==="parent"?"single":"parent")}
async function spDrop(ev){ev.preventDefault();$("#spdz").classList.remove("on");
  const ents=[...ev.dataTransfer.items].map(i=>i.webkitGetAsEntry&&i.webkitGetAsEntry()).filter(Boolean);
  const dirs=ents.filter(e=>e.isDirectory),loose=ents.length-dirs.length;
  if(!dirs.length){toast("Перетащите папки, а не отдельные файлы.","err");return}
  const st=$("#spst");const groups=[];let n=0;const prog=k=>{st.textContent=`Читаю папки… файлов: ${n+k}`};
  for(const d of dirs){const out=[];await spWalk(d,"",out,prog);n+=out.length;groups.push({name:d.name,files:out})}
  spAdd(groups);if(loose)toast(`Отдельные файлы (${loose}) пропущены — нужны папки.`,"err")}
function spPick(inp){const fs=[...inp.files];inp.value="";if(!fs.length)return;const root=(fs[0].webkitRelativePath||"").split("/")[0];
  spAdd([{name:root,files:fs.map(f=>({rel:f.webkitRelativePath||f.name,name:f.name,size:f.size,mtime:f.lastModified}))}],"parent")}

// На сервер — только имя, путь, размер, дата (50 ГБ на сервер не помещаются). Открыть файл можно с компьютера, где лежит папка.
async function sfUpload(){const sel=SP.F.filter(f=>f.on!==false&&SP.FILES[f.name]);if(!sel.length)throw new Error("Сначала добавьте папки поставщиков.");
  const R=spCompute();const st=$("#spst");const id=(Date.now().toString(36)+Math.random().toString(36).slice(2,8)).replace(/[^a-z0-9]/g,"");
  const rows=[];sel.forEach(f=>{const i=R.asg.get(f);const uchet=i>=0&&SP.names?SP.names[i]:"";
    SP.FILES[f.name].forEach(x=>{const p=x.rel.split("/");const k=p.indexOf(f.name);rows.push({supplier:f.name,path:(k>=0?p.slice(k):[f.name].concat(p.slice(-1))).join("/"),name:x.name,size:x.size,mtime:x.mtime?new Date(x.mtime).toISOString().slice(0,16):"",uchet})})});
  const N=2000;let rm=0;
  for(let i=0;i<rows.length;i+=N){const last=i+N>=rows.length;const r=await api("POST","/api/vs/sfiles/import",{import_id:id,rows:rows.slice(i,i+N),final:last,suppliers:last?sel.map(f=>f.name):[],total:rows.length});
    rm+=r.removed||0;if(st)st.textContent=`Отправляю список: ${Math.min(rows.length,i+N)} из ${rows.length} файлов…`}
  SP.msg=`Список файлов в поиске: папок ${sel.length}, файлов ${rows.length}${rm?` (прежний список заменён)`:""}. Ищите в «Задачи и согласования» → «📁 Файлы поставщиков».`;toast("Список файлов отправлен");vSplit()}
// папка на этом компьютере (Chrome): запоминаем доступ, чтобы открыть файл из поиска одним нажатием
const idb=(fn)=>new Promise((res,rej)=>{const o=indexedDB.open("vs_local",1);o.onupgradeneeded=()=>o.result.createObjectStore("kv");o.onerror=()=>rej(o.error);
  o.onsuccess=()=>{const tx=o.result.transaction("kv","readwrite");const r=fn(tx.objectStore("kv"));tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error)}});
async function sfRoot(ask){let h=null;try{h=await idb(s=>s.get("sfroot"))}catch(_){}
  if(!h||ask){if(!window.showDirectoryPicker)throw new Error("Открывать файлы с компьютера умеет только Chrome / Edge на компьютере.");
    h=await showDirectoryPicker({id:"vs_suppliers",mode:"read"});await idb(s=>s.put(h,"sfroot"))}
  if((await h.queryPermission({mode:"read"}))!=="granted"&&(await h.requestPermission({mode:"read"}))!=="granted")throw new Error("Нет доступа к папке.");
  return h}
async function sfFile(x){const h=await sfRoot(false);const parts=x.path.split("/");
  const walk=async(dir,ps)=>{let d=dir;for(const p of ps.slice(0,-1))d=await d.getDirectoryHandle(p);return (await d.getFileHandle(ps[ps.length-1])).getFile()};
  const tries=[h.name===parts[0]?parts.slice(1):parts,parts.slice(1)];
  for(const t of tries){try{return await walk(h,t)}catch(_){}}
  for await(const [n,e] of h.entries()){if(e.kind==="directory"){try{return await walk(e,parts)}catch(_){}}}   // общая папка на уровень выше
  throw new Error("Файл не найден в подключённой папке «"+h.name+"». Подключите общую папку поставщиков (кнопка «📁 Подключить папку»).")}
const sfSize=b=>b>1048576?(b/1048576).toFixed(1).replace(".",",")+" МБ":Math.max(1,Math.round(b/1024))+" КБ";
function sfBody(d){return `<div class="row" style="margin-bottom:6px;gap:6px"><button class="btn sm" id="sfcon">📁 Подключить папку на этом компьютере</button><span class="muted">чтобы открывать найденные файлы (Chrome)</span></div>`+

   <div class="muted">${esc(x.path)}${x.uchet?" · учётчица: "+esc(x.uchet):""}</div><div class="row" style="gap:6px;margin-top:4px"><button class="btn sm" data-sfo="${x.id}">📂 Открыть</button>${/^(pdf|jpe?g|png|heic|webp)$/.test(x.ext)?`<button class="btn sm acc" data-sfu="${x.id}">→ Прочитать как УПД</button>`:""}</div></div>`).join("")}
function sfBind(d){const c=$("#sfcon");if(c)c.onclick=()=>act(c,async()=>{const h=await sfRoot(true);toast("Папка подключена: "+h.name)});

function spExcel(R){

// разбор «Ведомость по учету МПЗ»: заголовок «Номенклатура», под ним «Количество / Стоимость»
function parseMpz(rows){
  const N=s=>String(s||"").toLowerCase().replace(/ё/g,"е").replace(/\s+/g," ").trim();
  const hi=rows.findIndex(r=>r&&r.some(c=>N(c)==="номенклатура")&&r.some(c=>/^склад$/.test(N(c))));if(hi<0)return null;
  const H=rows[hi].map(N),sub=(rows[hi+1]||[]).map(N);const col=re=>H.findIndex(h=>re.test(h));
  const pair=re=>{const i=col(re);if(i<0)return[-1,-1];return [sub[i]&&/кол/.test(sub[i])?i:i,sub[i+1]&&/стоим/.test(sub[i+1])?i+1:-1]};
  const C={wh:col(/^склад$/),acc:col(/^сч[её]т$/),name:col(/^номенклатура$/),code:col(/^код$/),q:col(/^качество$/),unit:col(/единица/),st:pair(/начальный остаток/),in:pair(/^приход/),out:pair(/^расход/),end:pair(/конечный остаток/)};
  if(C.name<0||C.end[0]<0)return null;
  let period="";for(let i=0;i<hi;i++){const t=(rows[i]||[]).map(x=>String(x||"")).join(" ");const m=t.match(/Период:\s*([^\n]+?)(?:\n|$|Группировки)/);if(m){period=m[1].trim();break}}
  const out=[];const v=(r,i)=>i>=0?r[i]:null;const nv=x=>typeof x==="number"?x:num(x);
  for(let i=hi+2;i<rows.length;i++){const r=rows[i];if(!r)continue;const name=xlStr(v(r,C.name));const wh=xlStr(v(r,C.wh));if(!name||/^итого/i.test(wh)||/^итого/i.test(name))continue;
    out.push({line_no:i+1,warehouse:wh,account:xlStr(v(r,C.acc)),name,code:String(v(r,C.code)??"").trim(),quality:xlStr(v(r,C.q)),unit:xlStr(v(r,C.unit)),
      qty_start:nv(v(r,C.st[0])),sum_start:nv(v(r,C.st[1])),qty_in:nv(v(r,C.in[0])),sum_in:nv(v(r,C.in[1])),qty_out:nv(v(r,C.out[0])),sum_out:nv(v(r,C.out[1])),qty_end:nv(v(r,C.end[0])),sum_end:nv(v(r,C.end[1]))})}
  return {rows:out,period};
}
async function importMpz(file,onProgress){
  const x=await readXlsx(file);let p=null;for(const sh of x.sheets){p=parseMpz(await x.rows(sh));if(p&&p.rows.length)break}
  if(!p||!p.rows.length)throw new Error("Это не похоже на «Ведомость по учету МПЗ»: нужны колонки «Склад», «Номенклатура» и «Конечный остаток».");
  const id=(Date.now().toString(36)+Math.random().toString(36).slice(2,8)).replace(/[^a-z0-9]/g,"");const N=500;let res=null;
  for(let i=0;i<p.rows.length;i+=N){res=await api("POST","/api/vs/mpz/import",{import_id:id,rows:p.rows.slice(i,i+N),final:i+N>=p.rows.length,file_name:file.name,period:p.period});onProgress&&onProgress(Math.min(p.rows.length,i+N),p.rows.length)}
  return {total:res.total,period:p.period};
}
async function mpzExcel(){

  const m=await api("GET","/api/vs/mpz/meta");const QS={r:XS.sR,g:XS.sG,y:XS.sY,b:XS.sB,gr:XS.sGr};
  const rows=[[{v:"ОСТАТКИ МПЗ — "+(m.period||""),s:XS.title}],[{v:"Отбор: "+([MPZ.q&&"«"+MPZ.q+"»",MPZ.wh&&whShort(MPZ.wh),MPZ.ql].filter(Boolean).join(", ")||"все")+" · строк "+items.length+" · выгружено "+new Date().toLocaleString("ru-RU"),s:XS.sub}],[],

    {v:x.qty_start,s:XS.num},{v:x.qty_in||"",s:XS.num},{v:x.qty_out||"",s:XS.num},{v:x.qty_end,s:XS.full},{v:Math.round(x.sum_end*100)/100,s:XS.num}]));
  saveBlob(xlsxBlob([{name:"Остатки МПЗ",cols:[60,14,24,7,14,7,12,10,10,12,14],rows,freeze:4,merges:["A1:K1","A2:K2"],filter:"A4:K"+rows.length}]),"Ostatki_MPZ_"+new Date().toISOString().slice(0,10)+".xlsx");
}

async function wkCompare(R,a,b){const key=t=>cNorm(t).replace(/\s+/g," ").trim();const qn=v=>{const n=Number(String(v||"").replace(/\s/g,"").replace(",","."));return isFinite(n)?n:0};

const lev1=(a,b)=>{if(a===b)return true;if(Math.abs(a.length-b.length)>1)return false;let i=0,j=0,d=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue}if(++d>1)return false;if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++}}return d+(a.length-i)+(b.length-j)<=1};

function certCover(its,certs,u){const C=certs.filter(c=>c.status==="done"||c.text).map(c=>({c,set:new Set(cToks(c.text+" "+c.number+" "+c.batch))}));

    const no=xlStr(typeof g("number")==="number"?String(g("number")):g("number"));if(!no||no==="13"&&i<=pick.hi+2)continue;

const bkLast=()=>{try{return +localStorage.getItem("vs_bk_last")||0}catch(_){return 0}};

async function bkRun(say){if(BK.busy)throw new Error("Бэкап уже идёт.");BK.busy=true;const t0=Date.now();

    const w=await (await dd.getFileHandle("velesstroy_"+stamp+".db",{create:true})).createWritable();await w.write(blob);await w.close();

    const names=[];for await(const [n,hd] of dd.entries())if(hd.kind==="file"&&/^velesstroy_.*\.db$/.test(n))names.push(n);names.sort();for(const n of names.slice(0,-10))try{await dd.removeEntry(n)}catch(_){}

function parseSpec(rows){
  const T=v=>lcq(v==null?"":String(v)).replace(/\s+/g," ").trim();

  if(hi<0)throw new Error("В файле нет шапки спецификации (колонки «Шифр объекта» и «Наименование Продукции»).");
  const H=rows[hi].map(T);const find=re=>H.findIndex(h=>re.test(h||""));
  const names=H.map((h,i)=>/наименовани/.test(h||"")?i:-1).filter(i=>i>=0);
  const cName=names.find(i=>/поставщ/.test(H[i]))??names[names.length-1];
  const C={no:find(/№/),obj:find(/шифр\s*объекта/),name:cName,unit:find(/ед\.?\s*изм/),qty:find(/кол-?\s*во/)};
  let specNo="";for(const r of rows.slice(0,hi)){const m=(r||[]).map(v=>v==null?"":String(v)).join(" ").match(/Спецификаци\S*\s*№\s*([\wА-Яа-я\-\/]+)/i);if(m){specNo=m[1];break}}
  const out=[];
  for(let i=hi+1;i<rows.length;i++){const r=rows[i]||[];const nm=xlStr(r[C.name]),q=r[C.qty];
    if(!nm||/^\d+$/.test(nm)&&!C.obj)continue;
    if(typeof q!=="number"&&isNaN(parseFloat(String(q||"").replace(",","."))))continue;   // строка номеров колонок, итоги, текст договора
    out.push({no:xlStr(r[C.no]),objcode:xlStr(r[C.obj]),name:nm,unit:xlStr(r[C.unit]),qty:typeof q==="number"?q:parseFloat(String(q).replace(",","."))})}
  if(!out.length)throw new Error("В спецификации нет строк с количеством.");
  return {spec_no:specNo,rows:out}}

/* ---------- 1.5: АРХИВ ЗАЯВОК (из старого Excel) ---------- */
let AR={q:"",from:"",to:"",page:1};
const isoD=v=>{if(v==null||v==="")return"";if(typeof v==="number"&&v>20000&&v<80000)return new Date(Math.round((v-25569)*86400000)).toISOString().slice(0,10);
  const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];m=s.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/);
  if(m){const y=m[3].length===2?"20"+m[3]:m[3];return y+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0")}return s.slice(0,30)};
function parseArchive(sheets){
  const out=[];
  sheets.forEach(({name,rows})=>{
    // заголовок: «Наименование ТМЦ» / «Наименование материала» / «Короткое описание МТР»
    const MAT=/наименование\s*(тмц|материала)|короткое\s*описание/;
    const hi=rows.findIndex(r=>r&&r.some(c=>typeof c==="string"&&MAT.test(c.toLowerCase().replace(/\s+/g," "))));if(hi<0)return;
    const H=rows[hi].map(c=>String(c||"").toLowerCase().replace(/ё/g,"е").replace(/\s+/g," ").trim());
    const col=re=>H.findIndex(h=>re.test(h));
    const omts=col(/заявк\S*\s*омтс/);
    const C={opp:H.findIndex((h,i)=>i!==omts&&(/заявк\S*\s*-?\s*опп/.test(h)||/^№\s*заявк\S*$/.test(h))),omts,applicant:col(/заявитель/),date:col(/дата\s*(заявки|передачи)/)>=0?col(/дата\s*(заявки|передачи)/):col(/^дата/),
      recipient:col(/получатель/),code:col(/шифр/),material:H.findIndex(h=>/наименование\s*(тмц|материала)/.test(h))>=0?H.findIndex(h=>/наименование\s*(тмц|материала)/.test(h)):col(MAT),
      flag:col(/проект\s*\/\s*не/),unit:col(/ед\.?\s*изм/),qty:col(/кол-?во|заказано|количество/),qtyi:col(/^выдано/),transfer:col(/перемещ/),note:col(/примечан/),
      section:col(/^раздел/),status:col(/статус/),idate:col(/дата\s*выдачи/)};
    const g=(r,k)=>C[k]>=0?r[C[k]]:null;
    for(let i=hi+1;i<rows.length;i++){const r=rows[i];if(!r)continue;const mat=xlStr(g(r,"material"));if(!mat)continue;
      const nq=v=>typeof v==="number"?v:num(v);
      out.push({row_key:(name+"#"+(i+1)).slice(0,120),sheet:name,line_no:i+1,opp_no:xlStr(g(r,"opp")).replace(/^-$/,""),omts_no:xlStr(g(r,"omts")).replace(/,000$/,""),applicant:xlStr(g(r,"applicant")),
        req_date:isoD(g(r,"date")),recipient:xlStr(g(r,"recipient")),project_code:xlStr(g(r,"code")),material:mat,proj_flag:xlStr(g(r,"flag")),unit:xlStr(g(r,"unit")),
        qty:nq(g(r,"qty")),qty_issued:nq(g(r,"qtyi")),transfer:xlStr(g(r,"transfer")),note:xlStr(g(r,"note")),section:xlStr(g(r,"section")),status:xlStr(g(r,"status")),issue_date:isoD(g(r,"idate"))})}
  });
  return out}
async function importArchive(file,onProgress){
  const x=await readXlsx(file);const sheets=[];for(const sh of x.sheets)sheets.push({name:sh.name,rows:await x.rows(sh)});
  const rows=parseArchive(sheets);if(!rows.length)throw new Error("Не найдено ни одной строки (нужна колонка «Наименование ТМЦ»).");
  const id=(Date.now().toString(36)+Math.random().toString(36).slice(2,8)).replace(/[^a-z0-9]/g,"");const N=300;let res=null;
  const sh=[...new Set(rows.map(r=>r.sheet))];rows.forEach(r=>r.source=file.name);
  for(let i=0;i<rows.length;i+=N){res=await api("POST","/api/vs/archive/import",{import_id:id,rows:rows.slice(i,i+N),final:i+N>=rows.length,file_name:file.name,sheets:sh});onProgress&&onProgress(Math.min(rows.length,i+N),rows.length)}
  return {rows:rows.length,sheets:[...new Set(rows.map(r=>r.sheet))],res}}
function arFilter(){const f=[];if(AR.q){const t=lcq(AR.q);const n=AR.q.replace(/\D/g,"");

const xlDate=v=>{if(v==null||v==="")return"";if(typeof v==="number"&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*86400000));return d.toISOString().slice(0,10).split("-").reverse().join(".")}
  return String(v).trim()};

// Разбор журнала: колонки ищутся по заголовкам, строки без № акта относятся к предыдущему акту
function parseActs(rows){
  let hi=rows.findIndex(r=>r&&r.some(c=>typeof c==="string"&&/акта/i.test(c))&&r.some(c=>typeof c==="string"&&/поставщик/i.test(c)));
  if(hi<0)throw new Error("Не найдена строка заголовков (№ акта, поставщик, ТОРГ-12).");
  const H=rows[hi].map(c=>String(c||"").toLowerCase());
  const col=(...re)=>H.findIndex(h=>re.every(r=>r.test(h)));
  const C={act_no:col(/№\s*акта/),act_date:col(/дата выдачи/),supplier:col(/поставщик/),torg:col(/торг|упд/),project:col(/шифр/),material:col(/наименование тмц|commodit/),
    unit:col(/единиц/),qty:col(/^количество\/|quantity/),reason:col(/причина/),act_code:col(/код акта/),author:col(/составивший/),doc_status:col(/статус документа/),
    act_status:col(/статус акта/),closed_date:col(/дата закрытия/),note:col(/примечани/),place:col(/на складе/)};
  if(C.act_no<0||C.supplier<0||C.torg<0)throw new Error("В файле нет колонок «№ акта», «Поставщик» или «ТОРГ-12».");
  const out=[];let cur=null,line=0;const g=(r,k)=>C[k]>=0?r[C[k]]:null;const seen={};
  for(let i=hi+1;i<rows.length;i++){const r=rows[i];if(!r)continue;

    if(!cur)continue;

    line++;
    out.push({row_key:cur.key+"#"+line,act_no:cur.act_no,act_date:cur.act_date,supplier:xlStr(g(r,"supplier"))||cur.supplier,torg:xlStr(g(r,"torg"))||cur.torg,
      project:xlStr(g(r,"project"))||cur.project,material:mat,unit:xlStr(g(r,"unit")),qty:xlStr(g(r,"qty")),reason:xlStr(g(r,"reason")),act_code:xlStr(g(r,"act_code"))||cur.act_code,
      author:xlStr(g(r,"author"))||cur.author,doc_status:xlStr(g(r,"doc_status")),act_status:xlStr(g(r,"act_status")),closed_date:xlDate(g(r,"closed_date")),note:xlStr(g(r,"note")),place:xlStr(g(r,"place"))});
  }

}
async function importActs(file,onProgress){

  const N=300;let res=null;
  for(let i=0;i<rows.length;i+=N){const fin=i+N>=rows.length;
    res=await api("POST","/api/vs/acts/import",{import_id:id,rows:rows.slice(i,i+N),final:fin,file_name:file.name});
    onProgress&&onProgress(Math.min(rows.length,i+N),rows.length)}

}

/* ---------- 1.9.8: БЕЗ ИНТЕРНЕТА — заявки (поиск), отгрузка, фото груза ----------
   Пока есть сеть, телефон сохраняет у себя открытые и недавние заявки с позициями и отгрузки.
   Без сети: поиск по заявкам, подготовка отгрузки и фото груза — в очередь; при появлении сети очередь отправляется сама. */
const OFF={data:null,box:[],syncing:false,lastSync:0};
const offDB=(mode,fn)=>new Promise((res,rej)=>{const o=indexedDB.open("vs_offline",1);o.onupgradeneeded=()=>{o.result.createObjectStore("kv")};o.onerror=()=>rej(o.error);
  o.onsuccess=()=>{const tx=o.result.transaction("kv",mode);const r=fn(tx.objectStore("kv"));tx.oncomplete=()=>{res(r&&r.result);o.result.close()};tx.onerror=()=>rej(tx.error)}});
const offGet=k=>offDB("readonly",s=>s.get(k)).catch(()=>null);
const offPut=(k,v)=>offDB("readwrite",s=>s.put(v,k));
const offCanUse=()=>S.user&&["admin","manager","storekeeper"].includes(S.user.role);
async function offLoadBox(){OFF.box=(await offGet("outbox"))||[];offPaint();return OFF.box}
async function offSaveBox(){await offPut("outbox",OFF.box);offPaint()}
function offPaint(){let b=$("#offq");const n=OFF.box.length;if(!b&&$("header")){b=document.createElement("button");b.id="offq";b.className="btn sm";b.style.cssText="background:#f2b705;color:#14181f;border:0;margin-left:6px";$("header").insertBefore(b,$("#net"));b.onclick=()=>offQueueView()}
  if(b){b.style.display=n?"":"none";b.textContent="⏳ "+n+" в очереди"+(OFF.box.some(x=>x.err)?" ⚠":"")}}
// копия заявок для работы без сети (раз в 5 минут, пока есть связь)
async function offSnap(force){if(!offCanUse()||S.off||(!force&&Date.now()-OFF.lastSync<300000))return;OFF.lastSync=Date.now();
  try{const d90=new Date(Date.now()-90*86400000).toISOString().replace("T"," ");
    // 1.9.26: копия для работы без сети — догружаем только изменённое с прошлого раза; целиком — раз в 2 часа

  return lab+`<input ${a} ${d.type==="number"?'inputmode="decimal"':d.type==="date"?'type="date"':""} value="${esc(d.type==="number"&&v!==""?String(v).replace(".",","):v)}">`}
const xfBlock=(f,extra)=>{const L=xfCustom(f);return L.length?`<div data-xf="${f}" class="xfb">${L.map(d=>xfInput(d,(extra||{})[d.key])).join("")}</div>`:""};
function xfRead(scope,old){const o=Object.assign({},old||{});scope.querySelectorAll("[data-xk]").forEach(i=>{o[i.dataset.xk]=i.type==="checkbox"?i.checked:i.value.trim()});return o}
// встроенные: переименовать / скрыть (обязательные для программы — только переименовать)
function xfApply(scope,f){xfDefs(f).filter(d=>d.builtin).forEach(d=>{const b=(XB[f]||[]).find(x=>x[0]===d.key);if(!b)return;
  scope.querySelectorAll(b[2]).forEach(el=>{const w=el.closest(".grow");let lab=w?w.querySelector("label.f"):el.previousElementSibling;if(lab&&!lab.matches("label"))lab=null;
    if(d.label&&lab)lab.textContent=d.label+(d.required||b[3]?" *":"");
    if(d.hidden&&!b[3]){if(w&&w.querySelectorAll("input,select,textarea").length===1)w.style.display="none";else{el.style.display="none";if(lab)lab.style.display="none"}}})})}
// проверка обязательных (свои + встроенные, отмеченные обязательными)
function xfCheck(scope,f,what){const miss=[];
  xfCustom(f).filter(d=>d.required&&d.type!=="photo").forEach(d=>{const i=scope.querySelector(`[data-xk="${d.key}"]`);if(i&&(i.type==="checkbox"?!i.checked:!i.value.trim()))miss.push(d.label)});
  xfDefs(f).filter(d=>d.builtin&&d.required&&!d.hidden).forEach(d=>{const b=(XB[f]||[]).find(x=>x[0]===d.key);if(!b)return;const i=scope.querySelector(b[2]);if(i&&!String(i.value||"").trim())miss.push(d.label||b[1])});
  if(miss.length)throw new Error((what?what+": ":"")+"заполните «"+miss.join("», «")+"»")}
// показ значений в карточке / просмотре
const xfVal=(d,v)=>d.type==="bool"?(v?"да":"нет"):d.type==="date"?dmy(v):d.type==="number"?String(v).replace(".",","):String(v);
const xfKV=(f,extra)=>xfCustom(f).filter(d=>d.type!=="photo"&&extra&&extra[d.key]!==undefined&&extra[d.key]!==""&&!(d.type==="bool"&&extra[d.key]===false)).map(d=>`<b>${esc(d.label)}</b><span>${esc(xfVal(d,extra[d.key]))}</span>`).join("");
const xfLine=(f,extra)=>xfCustom(f).filter(d=>d.type!=="photo"&&extra&&extra[d.key]!==undefined&&extra[d.key]!==""&&!(d.type==="bool"&&extra[d.key]===false)).map(d=>`${esc(d.label)}: <b>${esc(xfVal(d,extra[d.key]))}</b>`).join(" · ");
const xfCols=f=>xfCustom(f).filter(d=>d.type!=="photo");
const xfCell=(d,extra)=>{const v=(extra||{})[d.key];return v===undefined||v===""?"":d.type==="number"&&typeof v==="number"?v:xfVal(d,v)};
// фото / файлы своего поля на странице заявки или УПД
async function xfFilesBlock(f,recId,canW){const P=xfCustom(f).filter(d=>d.type==="photo");if(!P.length)return "";
  const fs=await all("field_files",`rec="${recId}"`,"created").catch(()=>[]);const ft=fs.length?await fileToken():"";
  return `<div class="card" data-xff="${f}" data-rec="${recId}">${P.map(d=>{const L=fs.filter(x=>x.key===d.key);return `<b>${esc(d.label)}</b><div class="row" style="gap:6px;margin:6px 0;flex-wrap:wrap">${L.map(x=>{const u=`/api/files/field_files/${x.id}/${encodeURIComponent(x.file)}?token=${ft}`;
    return /\.pdf$/i.test(x.file)?`<a class="btn sm" href="${u}" target="_blank" rel="noopener">📄 PDF</a>${canW?`<button class="btn sm" data-xfd="${x.id}">✕</button>`:""}`:`<span style="position:relative"><a href="${u}" target="_blank" rel="noopener"><img src="${u}&thumb=480x0" alt="" style="width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line)"></a>${canW?`<button class="btn sm" data-xfd="${x.id}" style="position:absolute;top:0;right:0;padding:2px 6px">✕</button>`:""}</span>`}).join("")||'<span class="muted">нет файлов</span>'}</div>
    ${canW?`<label class="btn sm">📷 Добавить<input type="file" data-xfu="${d.key}" accept="image/*,application/pdf" multiple hidden></label>`:""}`}).join("<hr>")}</div>`}
function xfFilesBind(again){document.querySelectorAll("[data-xff]").forEach(box=>{const f=box.dataset.xff,rec=box.dataset.rec;
  box.querySelectorAll("[data-xfu]").forEach(i=>i.onchange=()=>act(null,async()=>{const fd=new FormData();fd.append("form",f);fd.append("rec",rec);fd.append("key",i.dataset.xfu);
    for(const x of i.files)fd.append("file",/^image\//.test(x.type)?await shrink(x):x);await api("POST","/api/vs/fields/file",fd,true);again()},"Файлы добавлены"));
  box.querySelectorAll("[data-xfd]").forEach(b=>b.onclick=()=>{if(confirm("Удалить файл?"))act(b,async()=>{await api("POST","/api/vs/fields/file_delete",{id:b.dataset.xfd});again()},"Удалено")})})}
// ---- страница настройки ----
const XFF={form:"request"};
async function vFields(){const j=await xfLoad(true);if(S.route!=="fields")return;const f=XFF.form,D=j.defs[f]||[];
  const B=XB[f].map(b=>{const d=D.find(x=>x.builtin&&x.key===b[0]);return {b,d}});const C=D.filter(d=>!d.builtin);
  $("#main").innerHTML=`<div class="row noprint"><a class="btn sm" href="#/users">← Пользователи</a></div><h1>Поля форм</h1>
   <div class="muted" style="margin-bottom:8px">Добавляйте свои поля, переименовывайте и скрывайте встроенные. Изменения видны всем сразу. Скрытое или удалённое поле не стирает уже введённые данные.</div>
   <div class="tabs" style="flex-wrap:wrap;margin-bottom:10px">${["request","request_item","act_row","upd","subtopic","board"].filter(k=>j.forms[k]).map(k=>`<button class="${k===f?"on":""}" data-xff2="${k}">${esc(j.forms[k])}</button>`).join("")}</div>
   <h2>Свои поля (${C.length})</h2><div class="card">${C.length?`<div class="tw"><table><tr><th>Название</th><th>Тип</th><th>Обяз.</th><th>Видно</th><th></th></tr>${C.map((d,i)=>`<tr${d.hidden?' class="muted"':""}><td><b>${esc(d.label)}</b>${d.type==="select"?`<div class="muted">${esc((d.options||[]).join(" · "))}</div>`:""}${d.hint?`<div class="muted">${esc(d.hint)}</div>`:""}</td><td>${esc(j.types[d.type]||d.type)}</td><td>${d.required?"✔":""}</td><td>${d.hidden?"скрыто":"✔"}</td>
     <td style="white-space:nowrap"><button class="btn sm" data-up="${d.id}" ${i?"":"disabled"} aria-label="Выше">▲</button><button class="btn sm" data-dn="${d.id}" ${i<C.length-1?"":"disabled"} aria-label="Ниже">▼</button><button class="btn sm" data-xe="${d.id}">✏</button><button class="btn sm" data-xh="${d.id}">${d.hidden?"Показать":"Скрыть"}</button><button class="btn sm" data-xdel="${d.id}">🗑</button></td></tr>`).join("")}</table></div>`:'<div class="empty">Своих полей нет</div>'}
    <div class="row" style="margin-top:8px"><button class="btn p" id="xfadd">＋ Добавить поле</button></div></div>
   <h2>Встроенные поля</h2><div class="card tw"><table><tr><th>Поле</th><th>Название в форме</th><th>Обяз.</th><th>Видно</th><th></th></tr>${B.map(({b,d})=>`<tr><td class="muted">${esc(b[1])}${b[3]?' <span class="pill gr">нужно программе</span>':""}</td><td><b>${esc(d&&d.label||b[1])}</b></td><td>${b[3]||d&&d.required?"✔":""}</td><td>${d&&d.hidden?"скрыто":"✔"}</td>
     <td style="white-space:nowrap"><button class="btn sm" data-be="${b[0]}">✏ Изменить</button>${d?`<button class="btn sm" data-br="${d.id}">↺ Как было</button>`:""}</td></tr>`).join("")}</table></div>`;
  document.querySelectorAll("[data-xff2]").forEach(b=>b.onclick=()=>{XFF.form=b.dataset.xff2;vFields()});
  const again=async()=>{await xfLoad(true);vFields()};
  $("#xfadd").onclick=()=>xfEdit(f,null,again);
  document.querySelectorAll("[data-xe]").forEach(b=>b.onclick=()=>xfEdit(f,C.find(d=>d.id===b.dataset.xe),again));
  document.querySelectorAll("[data-xh]").forEach(b=>b.onclick=()=>{const d=C.find(x=>x.id===b.dataset.xh);act(b,async()=>{await api("POST","/api/vs/fields/save",Object.assign({},d,{hidden:!d.hidden}));await again()})});
  document.querySelectorAll("[data-xdel]").forEach(b=>b.onclick=()=>{const d=C.find(x=>x.id===b.dataset.xdel);if(!confirm("Удалить поле «"+d.label+"»? Оно исчезнет из форм. Уже введённые значения останутся в записях, но видны не будут."))return;act(b,async()=>{await api("POST","/api/vs/fields/delete",{id:d.id});await again()},"Поле удалено")});
  const mv=(id,dir)=>{const ids=C.map(d=>d.id);const i=ids.indexOf(id);const j2=i+dir;if(j2<0||j2>=ids.length)return;[ids[i],ids[j2]]=[ids[j2],ids[i]];act(null,async()=>{await api("POST","/api/vs/fields/order",{ids:B.filter(x=>x.d).map(x=>x.d.id).concat(ids)});await again()})};
  document.querySelectorAll("[data-up]").forEach(b=>b.onclick=()=>mv(b.dataset.up,-1));document.querySelectorAll("[data-dn]").forEach(b=>b.onclick=()=>mv(b.dataset.dn,1));
  document.querySelectorAll("[data-be]").forEach(b=>b.onclick=()=>{const x=B.find(y=>y.b[0]===b.dataset.be);xfEditB(f,x.b,x.d,again)});
  document.querySelectorAll("[data-br]").forEach(b=>b.onclick=()=>act(b,async()=>{await api("POST","/api/vs/fields/delete",{id:b.dataset.br});await again()},"Вернули как было"));
}
function xfEdit(f,d,done){const j=XF.j;const T=Object.keys(j.types).filter(t=>t!=="photo"||j.photo_ok[f]);
  modal(`<h3>${d?"Изменить поле":"Новое поле"} — ${esc(j.forms[f])}</h3>
   <label class="f">Название *</label><input id="xl" value="${esc(d?d.label:"")}" placeholder="например: Номер машины">
   <label class="f">Тип</label><select id="xt" ${d?"disabled":""}>${T.map(t=>`<option value="${t}" ${d&&d.type===t?"selected":""}>${esc(j.types[t])}</option>`).join("")}</select>${d?'<div class="muted">тип после создания не меняется</div>':""}
   <div id="xob"><label class="f">Варианты списка (каждый с новой строки)</label><textarea id="xo" rows="4">${esc(d?(d.options||[]).join("\n"):"")}</textarea></div>
   <label class="f">Подсказка (необязательно)</label><input id="xhn" value="${esc(d?d.hint:"")}">
   <label class="row" style="margin-top:10px;font-weight:600;gap:8px"><input type="checkbox" id="xr" ${d&&d.required?"checked":""} style="width:22px;height:22px"> Обязательное</label>
   <div class="row" style="margin-top:14px"><button class="btn p grow" id="mok">СОХРАНИТЬ</button><button class="btn" data-close>Отмена</button></div>`,box=>{
   const sw=()=>$("#xob",box).style.display=$("#xt",box).value==="select"?"":"none";sw();$("#xt",box).onchange=sw;
   $("#mok",box).onclick=e=>act(e.target,async()=>{await api("POST","/api/vs/fields/save",{id:d?d.id:"",form:f,label:$("#xl",box).value,type:$("#xt",box).value,options:$("#xo",box).value.split("\n"),hint:$("#xhn",box).value,required:$("#xr",box).checked,hidden:d?d.hidden:false});closeModal();await done()},"Сохранено")})}
function xfEditB(f,b,d,done){
  modal(`<h3>Встроенное поле «${esc(b[1])}»</h3><label class="f">Название в форме</label><input id="xl" value="${esc(d&&d.label||"")}" placeholder="${esc(b[1])}">
   ${b[3]?`<div class="muted" style="margin-top:8px">Это поле нужно программе — его можно переименовать, но не скрыть.</div>`:`<label class="row" style="margin-top:10px;font-weight:600;gap:8px"><input type="checkbox" id="xh" ${d&&d.hidden?"checked":""} style="width:22px;height:22px"> Скрыть из формы</label>
   <label class="row" style="margin-top:6px;font-weight:600;gap:8px"><input type="checkbox" id="xr" ${d&&d.required?"checked":""} style="width:22px;height:22px"> Обязательное</label>`}
   <div class="row" style="margin-top:14px"><button class="btn p grow" id="mok">СОХРАНИТЬ</button><button class="btn" data-close>Отмена</button></div>`,box=>{
   $("#mok",box).onclick=e=>act(e.target,async()=>{const h=$("#xh",box),r=$("#xr",box);await api("POST","/api/vs/fields/save",{form:f,builtin:true,key:b[0],core:!!b[3],label:$("#xl",box).value,hidden:h?h.checked:false,required:r?r.checked:false});closeModal();await done()},"Сохранено")})}

/* ---------- Модальное окно ---------- */
function modal(html,bind){closeModal();const m=document.createElement("div");m.className="modal";m.id="modal";m.innerHTML=`<div class="box">${html}</div>`;
  m.addEventListener("click",e=>{if(e.target===m||e.target.hasAttribute("data-close"))closeModal()});document.body.appendChild(m);
  bind&&bind(m);const f=m.querySelector("input:not([type=checkbox]),textarea,select");if(f&&innerWidth>860)f.focus()}
function closeModal(){const m=$("#modal");if(m)m.remove()}

/* ---------- Старт ---------- */
(async function(){
  // 1.9.10: ссылка на «Склад / СКК» (…/?k=…): вход без пароля, видна только эта страница
  const k=new URLSearchParams(location.search).get("k");
  if(k){try{const r=await fetch("/api/vs/pub/skk/"+encodeURIComponent(k),{method:"POST"});const j=await r.json();if(!r.ok)throw new Error(j.message||"Ссылка не работает");
      S.auth=j.token;S.user=j.record;try{localStorage.setItem("vs_auth",JSON.stringify({t:j.token,u:j.record}))}catch(_){}
      history.replaceState(null,"","/"+(location.hash&&location.hash!=="#/"&&location.hash!=="#/skk"?location.hash:j.record.scope==="zay"?"#/requests":"#/skk"));boot();return}
    catch(e){history.replaceState(null,"","/");document.getElementById("app").innerHTML=`<div class="card" style="max-width:460px;margin:60px auto;text-align:center"><h2>ВЕЛЕССТРОЙ — Склад / СКК</h2><div class="banner red" style="font-size:16px">${esc(e.message)}</div><div class="muted">Попросите у отправителя новую ссылку.</div></div>`;return}}
  let s=null;try{s=JSON.parse(localStorage.getItem("vs_auth")||"null")}catch(_){}
  if(s&&s.t){S.auth=s.t;S.user=s.u;boot()}else drawLogin()})();
</script>
